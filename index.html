<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Reaction Caller</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --accent: #4f8cff;
    --accent-down: #3a6fd6;
    --danger: #ff4f5e;
    --danger-down: #d93d4a;
    --text: #f2f3f5;
    --muted: #9aa1ab;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
    user-select: none;
  }

  #app {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
              max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }

  .screen {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(16px, 4vh, 32px);
  }

  .hidden { display: none !important; }

  h1 {
    font-size: clamp(1.6rem, 6vw, 2.2rem);
    margin: 0;
    text-align: center;
  }

  .subtitle {
    color: var(--muted);
    font-size: clamp(0.85rem, 3vw, 1rem);
    text-align: center;
    margin: -8px 0 0;
  }

  .panel {
    background: var(--panel);
    border-radius: 16px;
    padding: clamp(16px, 4vw, 24px);
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 0.9rem;
    color: var(--muted);
  }

  .field input[type="number"] {
    background: #0f1115;
    border: 1px solid #2a2e38;
    border-radius: 10px;
    color: var(--text);
    font-size: 1.1rem;
    padding: 12px 14px;
    width: 100%;
  }

  .field input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
  }

  .range-row {
    display: flex;
    gap: 12px;
  }

  .range-row .field { flex: 1; }

  .error {
    color: var(--danger);
    font-size: 0.85rem;
    min-height: 1.1em;
    text-align: center;
  }

  button {
    border: none;
    border-radius: 14px;
    font-size: clamp(1rem, 4vw, 1.2rem);
    font-weight: 600;
    padding: clamp(14px, 4vw, 18px) 24px;
    width: 100%;
    cursor: pointer;
    color: #fff;
    transition: transform 0.08s ease;
  }

  button:active { transform: scale(0.97); }

  #startBtn { background: var(--accent); }
  #startBtn:active { background: var(--accent-down); }

  #stopBtn { background: var(--danger); }
  #stopBtn:active { background: var(--danger-down); }

  #gameScreen {
    height: 100%;
    justify-content: space-between;
    min-height: 70vh;
    min-height: 70dvh;
  }

  .word-stage {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #word {
    font-size: clamp(3rem, 16vw, 6rem);
    font-weight: 800;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.12s ease, transform 0.12s ease;
  }

  #word.show {
    opacity: 1;
    transform: scale(1);
  }

  .segmented {
    display: flex;
    gap: 4px;
    width: 100%;
    padding: 4px;
    background: var(--panel);
    border-radius: 14px;
  }

  .segmented button {
    flex: 1;
    background: transparent;
    color: var(--muted);
    font-size: 1rem;
    padding: 10px 12px;
    border-radius: 10px;
  }

  .segmented button[aria-pressed="true"] {
    background: #2a2e38;
    color: var(--text);
  }

  /* The drill switch sits inside a panel, so it needs a darker track. */
  .panel .segmented { background: var(--bg); }
  .panel .segmented button { padding: 10px 6px; }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .mode-label {
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.18em;
  }

  .panel-title {
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0;
  }

  details.advanced summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .advanced-body {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 14px;
  }

  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .weight-title {
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 600;
    margin: 0 0 8px;
  }

  .countdown {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .countdown.idle { visibility: hidden; }

  .countdown-track {
    flex: 1;
    height: 10px;
    background: #2a2e38;
    border-radius: 999px;
    overflow: hidden;
  }

  .countdown-fill {
    height: 100%;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left center;
  }

  .countdown-text {
    min-width: 3.5em;
    text-align: right;
    color: var(--muted);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  /* Multi-word offense phrases: smaller and allowed to wrap so they fit at 320px. */
  #word.long {
    font-size: clamp(2rem, 10vw, 3.75rem);
    line-height: 1.05;
    text-align: center;
    max-width: 100%;
    overflow-wrap: break-word;
  }

  /* Phrases over 18 characters (e.g. "SPRINT FROM RIGHT CORNER"): one step smaller. */
  #word.xlong {
    font-size: clamp(1.6rem, 8vw, 3rem);
  }

  /* Number stepper (− / +) for fields filled in by hand: 48px+ touch targets. */
  .stepper {
    display: flex;
    gap: 8px;
  }

  .stepper button {
    flex: none;
    width: 56px;
    min-height: 48px;
    padding: 0;
    background: #2a2e38;
    color: var(--text);
    font-size: 1.6rem;
    line-height: 1;
    border-radius: 10px;
  }

  .stepper button:active { background: #3a3f4b; }

  .field .stepper input[type="number"] {
    flex: 1;
    min-width: 0;
    min-height: 48px;
    text-align: center;
    font-size: 1.25rem;
    -moz-appearance: textfield;
    appearance: textfield;
  }

  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  /* Game screen header: mode label, set/rep progress, session clock in the corner. */
  .game-header {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .session-progress {
    color: var(--muted);
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    font-variant-numeric: tabular-nums;
  }

  .session-clock {
    position: absolute;
    top: 0;
    right: 0;
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .session-banner {
    width: 100%;
    background: var(--panel);
    border-left: 4px solid #ffd24f;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 0.95rem;
    line-height: 1.35;
  }

  #nextSetBtn {
    background: var(--accent);
    min-height: 80px;
    font-size: clamp(1.3rem, 6vw, 1.6rem);
  }
  #nextSetBtn:active { background: var(--accent-down); }

  #endSessionBtn {
    background: #2a2e38;
    min-height: 56px;
  }

  .word-read { color: var(--text); }
  .word-sprint { color: #ff7a4f; }
  .word-catch { color: var(--text); }
  .word-shot { color: #ffd24f; }
  .word-nope { color: #ff6bd6; }
  .word-center { color: #c47bff; }
  .word-cut { color: #ff4f5e; }
  .word-layup { color: #ffd24f; }

  .word-left { color: #4f8cff; }
  .word-right { color: #4fd87c; }
  .word-up { color: #ffd24f; }
  .word-back { color: #ff7a4f; }
</style>
</head>
<body>
<div id="app">

  <div id="startScreen" class="screen">
    <div class="segmented" role="group" aria-label="Mode">
      <button type="button" data-mode="defense" aria-pressed="true">Defense</button>
      <button type="button" data-mode="offense" aria-pressed="false">Offense</button>
    </div>

    <h1>Reaction Caller</h1>
    <p class="subtitle" id="subtitle">A voice randomly calls Left, Right, Up, or Back. React fast.</p>

    <div class="panel" id="rangePanel">
      <div class="range-row">
        <div class="field">
          <label for="minMs" id="minMsLabel">Min delay (ms)</label>
          <input type="number" id="minMs" value="1000" min="100" step="100">
        </div>
        <div class="field">
          <label for="maxMs" id="maxMsLabel">Max delay (ms)</label>
          <input type="number" id="maxMs" value="3000" min="100" step="100">
        </div>
      </div>
      <div class="error" id="rangeError"></div>
    </div>

    <div class="panel hidden" id="offensePanel">
      <div class="segmented" role="group" aria-label="Offense drill">
        <button type="button" data-drill="drive" aria-pressed="true">Drive</button>
        <button type="button" data-drill="shooters" aria-pressed="false">Shooters only</button>
      </div>

      <!-- Drive drill only -->
      <div class="panel-section" id="driveSettings">
        <div class="range-row">
          <div class="field">
            <label for="driveMinMs">Min drive window (ms)</label>
            <input type="number" id="driveMinMs" min="600" step="100" data-setting="driveMinMs">
          </div>
          <div class="field">
            <label for="driveMaxMs">Max drive window (ms)</label>
            <input type="number" id="driveMaxMs" min="600" step="100" data-setting="driveMaxMs">
          </div>
        </div>
        <div class="error" id="driveError"></div>

        <details class="advanced" id="advanced">
          <summary>Advanced</summary>
          <div class="advanced-body">
            <div class="field-grid">
              <div class="field">
                <label for="resetPauseMs">Reset pause (ms)</label>
                <input type="number" id="resetPauseMs" min="0" step="100" data-setting="resetPauseMs">
              </div>
              <div class="field">
                <label for="finisherBufferMs">Finisher buffer (ms)</label>
                <input type="number" id="finisherBufferMs" min="0" step="10" data-setting="finisherBufferMs">
              </div>
              <div class="field">
                <label for="maxCutOffsPerDrive">Max cut offs per drive</label>
                <input type="number" id="maxCutOffsPerDrive" min="0" max="3" step="1" data-setting="maxCutOffsPerDrive">
              </div>
              <div class="field">
                <label for="maxLayUpsPerDrive">Max lay ups per drive</label>
                <input type="number" id="maxLayUpsPerDrive" min="0" max="5" step="1" data-setting="maxLayUpsPerDrive">
              </div>
            </div>
            <div id="weightTables"></div>
            <div class="error" id="advancedError"></div>
          </div>
        </details>
      </div>

      <!-- Shooters only drill -->
      <div class="panel-section hidden" id="shootersSettings">
        <div class="range-row">
          <div class="field">
            <label for="shWindowMinMs">Min window (ms)</label>
            <input type="number" id="shWindowMinMs" min="600" step="100" data-setting="shooters.windowMinMs">
          </div>
          <div class="field">
            <label for="shWindowMaxMs">Max window (ms)</label>
            <input type="number" id="shWindowMaxMs" min="600" step="100" data-setting="shooters.windowMaxMs">
          </div>
        </div>
        <div class="field">
          <label for="shResetPauseMs">Reset pause (ms)</label>
          <input type="number" id="shResetPauseMs" min="0" step="100" data-setting="shooters.resetPauseMs">
        </div>
        <div class="error" id="shootersError"></div>

        <details class="advanced" id="shootersAdvanced">
          <summary>Advanced</summary>
          <div class="advanced-body">
            <div id="getSetFields"></div>
            <div class="field-grid">
              <div class="field">
                <label for="shNopeGapMinMs">Nope gap min (ms)</label>
                <input type="number" id="shNopeGapMinMs" min="0" step="10" data-setting="shooters.nopeGapMinMs">
              </div>
              <div class="field">
                <label for="shNopeGapMaxMs">Nope gap max (ms)</label>
                <input type="number" id="shNopeGapMaxMs" min="0" step="10" data-setting="shooters.nopeGapMaxMs">
              </div>
              <div class="field">
                <label for="shAfterNopeGapMinMs">After-nope gap min (ms)</label>
                <input type="number" id="shAfterNopeGapMinMs" min="0" step="10" data-setting="shooters.afterNopeGapMinMs">
              </div>
              <div class="field">
                <label for="shAfterNopeGapMaxMs">After-nope gap max (ms)</label>
                <input type="number" id="shAfterNopeGapMaxMs" min="0" step="10" data-setting="shooters.afterNopeGapMaxMs">
              </div>
              <div class="field">
                <label for="shShotBufferMs">Shot buffer (ms)</label>
                <input type="number" id="shShotBufferMs" min="0" step="10" data-setting="shooters.shotBufferMs">
              </div>
              <div class="field">
                <label for="shMaxCutOffsPerWindow">Max cut offs per window</label>
                <input type="number" id="shMaxCutOffsPerWindow" min="0" max="5" step="1" data-setting="shooters.maxCutOffsPerWindow">
              </div>
              <div class="field">
                <label for="shMaxNopesPerRep">Max nopes per rep</label>
                <input type="number" id="shMaxNopesPerRep" min="0" max="3" step="1" data-setting="shooters.maxNopesPerRep">
              </div>
            </div>
            <div id="shootersWeightTables"></div>
            <div class="error" id="shootersAdvancedError"></div>
          </div>
        </details>
      </div>

      <!-- Session structure, shared by both drills -->
      <div class="panel-section" id="sessionSettings">
        <p class="panel-title">Session</p>
        <div class="field">
          <label for="repsPerSet">Reps per set</label>
          <div class="stepper">
            <button type="button" data-step="-1" aria-label="Fewer reps per set">−</button>
            <input type="number" id="repsPerSet" min="3" max="30" step="1" inputmode="numeric" data-training="repsPerSet">
            <button type="button" data-step="1" aria-label="More reps per set">+</button>
          </div>
        </div>
        <div class="field">
          <label for="plannedSets">Planned sets</label>
          <div class="stepper">
            <button type="button" data-step="-1" aria-label="Fewer planned sets">−</button>
            <input type="number" id="plannedSets" min="1" max="20" step="1" inputmode="numeric" data-training="plannedSets">
            <button type="button" data-step="1" aria-label="More planned sets">+</button>
          </div>
        </div>
        <div class="field">
          <label for="sessionWarningMin">Session time warning (min, 0 = off)</label>
          <div class="stepper">
            <button type="button" data-step="-1" aria-label="Earlier session time warning">−</button>
            <input type="number" id="sessionWarningMin" min="0" step="5" inputmode="numeric" data-training="sessionWarningMin">
            <button type="button" data-step="1" aria-label="Later session time warning">+</button>
          </div>
        </div>
        <div class="error" id="sessionError"></div>
      </div>

      <!-- Shared by both drills -->
      <details class="advanced" id="speech">
        <summary>Speech (both drills)</summary>
        <div class="advanced-body">
          <div class="field-grid">
            <div class="field">
              <label for="baseRate">Base speech rate</label>
              <input type="number" id="baseRate" min="0.5" max="2" step="0.05" inputmode="decimal" data-setting="baseRate">
            </div>
            <div class="field">
              <label for="maxRate">Max speech rate</label>
              <input type="number" id="maxRate" min="0.5" max="2" step="0.05" inputmode="decimal" data-setting="maxRate">
            </div>
            <div class="field">
              <label for="minGapMs">Min gap (ms)</label>
              <input type="number" id="minGapMs" min="0" step="10" data-setting="minGapMs">
            </div>
            <div class="field">
              <label for="speechLeadMs">Speech lead (ms)</label>
              <input type="number" id="speechLeadMs" min="0" step="10" data-setting="speechLeadMs">
            </div>
          </div>
          <div class="error" id="speechError"></div>
        </div>
      </details>
    </div>

    <button id="startBtn">Start</button>
  </div>

  <div id="gameScreen" class="screen hidden">
    <div class="session-banner hidden" id="sessionBanner" role="status"></div>
    <div class="game-header">
      <div class="session-clock hidden" id="sessionClock">00:00</div>
      <div class="mode-label" id="modeLabel">DEFENSE</div>
      <div class="session-progress hidden" id="sessionProgress"></div>
    </div>
    <div class="word-stage">
      <div id="word">&nbsp;</div>
    </div>
    <div class="countdown idle hidden" id="countdown">
      <div class="countdown-track"><div class="countdown-fill" id="countdownFill"></div></div>
      <div class="countdown-text" id="countdownText">0.0 s</div>
    </div>
    <button id="stopBtn">Stop</button>
  </div>

  <!-- Offense: shown when a set ends. Placeholder; a log form replaces it later. -->
  <div id="setScreen" class="screen hidden">
    <div class="mode-label" id="setScreenLabel">OFFENSE</div>
    <h1>Set complete</h1>
    <p class="subtitle" id="setDoneText"></p>
    <button id="nextSetBtn">Next set</button>
    <button id="endSessionBtn">End session</button>
  </div>

</div>

<script>
// Offense-mode planner. Pure functions only (no DOM, no timers), so the
// ?selftest=1 simulation can exercise exactly the code the game uses.
const OffensePlanner = (function () {
  "use strict";

  // ===================================================================
  // OFFENSE_DEFAULTS: every tunable offense number lives here.
  // The start screen shows these as defaults; saved values override them.
  // The read dwell (wait after READ before a drive starts) is NOT here:
  // it comes from the shared Min/Max read time fields (1000-3000 ms).
  // ===================================================================
  const OFFENSE_DEFAULTS = {
    // Drive window D (ms). Picked uniformly in this range each time LEFT/RIGHT is called.
    driveMinMs: 1400,
    driveMaxMs: 2000,

    // Wait after a drive ends before READ is called again (ms).
    resetPauseMs: 1000,

    // Speech rate. A whole drive is spoken at one rate: baseRate, raised
    // toward maxRate only when the planned calls would not fit otherwise.
    baseRate: 1.25,
    maxRate: 1.6,

    // Minimum silence between two calls in a drive (ms).
    minGapMs: 120,

    // The finisher must finish being spoken this long before D ends (ms).
    finisherBufferMs: 0,

    // Speak each call this much early to offset TTS startup latency (ms).
    speechLeadMs: 0,

    // Caps per drive. A pick that would exceed a cap is not allowed.
    maxCutOffsPerDrive: 3,
    maxLayUpsPerDrive: 2,

    // Pick weights (any non-negative numbers). Normalized at pick time,
    // after illegal and non-fitting choices have been removed.
    startWeights: { LEFT: 50, RIGHT: 50 },
    afterDriveOrCutOffWeights: {
      CUT_OFF: 20, LAY_UP: 20, LAY_UP_LEFT_SIDE: 20, LAY_UP_RIGHT_SIDE: 20, LAY_UP_CENTER_SIDE: 20,
    },
    afterLayUpWeights: { CUT_OFF: 25, LEFT_SIDE: 25, RIGHT_SIDE: 25, CENTER_SIDE: 25 },

    // Learning spoken lengths on this device (onstart -> onend, normalized to rate 1.0).
    // Each accepted measurement moves the stored value this fraction of the way.
    learnAlpha: 0.3,
    // Measurements outside [low, high] x the current value are ignored as outliers.
    learnOutlierLow: 0.4,
    learnOutlierHigh: 2.5,

    // Phrases. display = shown on screen; spoken = sent to the voice (fix
    // pronunciation here); estMs = rough spoken length at rate 1.0.
    // Measured lengths, once learned on a device, replace estMs.
    phrases: {
      READ:               { display: "READ",               spoken: "read",               estMs: 350 },
      LEFT:               { display: "LEFT",               spoken: "left",               estMs: 350 },
      RIGHT:              { display: "RIGHT",              spoken: "right",              estMs: 350 },
      CUT_OFF:            { display: "CUT OFF",            spoken: "cut off",            estMs: 450 },
      LAY_UP:             { display: "LAY UP",             spoken: "lay up",             estMs: 450 },
      LEFT_SIDE:          { display: "LEFT SIDE",          spoken: "left side",          estMs: 650 },
      RIGHT_SIDE:         { display: "RIGHT SIDE",         spoken: "right side",         estMs: 650 },
      CENTER_SIDE:        { display: "CENTER SIDE",        spoken: "center side",        estMs: 750 },
      LAY_UP_LEFT_SIDE:   { display: "LAY UP LEFT SIDE",   spoken: "lay up left side",   estMs: 1000 },
      LAY_UP_RIGHT_SIDE:  { display: "LAY UP RIGHT SIDE",  spoken: "lay up right side",  estMs: 1000 },
      LAY_UP_CENTER_SIDE: { display: "LAY UP CENTER SIDE", spoken: "lay up center side", estMs: 1100 },
      // Shooters only drill (LEFT, RIGHT and CUT_OFF above are shared with Drive).
      SPRINT_FROM_PAINT:        { display: "SPRINT FROM PAINT",        spoken: "sprint from paint",        estMs: 900 },
      SPRINT_FROM_LEFT_CORNER:  { display: "SPRINT FROM LEFT CORNER",  spoken: "sprint from left corner",  estMs: 1100 },
      SPRINT_FROM_RIGHT_CORNER: { display: "SPRINT FROM RIGHT CORNER", spoken: "sprint from right corner", estMs: 1150 },
      CATCH:                    { display: "CATCH",                    spoken: "catch",                    estMs: 400 },
      SHOT:                     { display: "SHOT",                     spoken: "shot",                     estMs: 350 },
      NOPE:                     { display: "NOPE",                     spoken: "nope",                     estMs: 350 },
    },

    // ---------------------------------------------------------------
    // Shooters only drill: a start call (sprint from a spot, or CATCH),
    // then one or two create-space windows of LEFT/RIGHT, 0+ CUT OFF, SHOT.
    // A NOPE after SHOT (shot contested) starts the second window.
    // The speech settings above (baseRate, maxRate, minGapMs, speechLeadMs)
    // are shared with Drive; nothing else from Drive applies here.
    // ---------------------------------------------------------------
    shooters: {
      // Create-space window D (ms). Picked uniformly per window when LEFT/RIGHT is called.
      windowMinMs: 1000,
      windowMaxMs: 1800,

      // Get-set time (ms) from the start of the start call to the first LEFT/RIGHT.
      // Silently raised to at least the start call's length (at baseRate) + minGapMs.
      getSetMs: {
        SPRINT_FROM_PAINT:        { minMs: 1500, maxMs: 2200 },
        SPRINT_FROM_LEFT_CORNER:  { minMs: 1300, maxMs: 2000 },
        SPRINT_FROM_RIGHT_CORNER: { minMs: 1300, maxMs: 2000 },
        CATCH:                    { minMs: 400,  maxMs: 800 },
      },

      // SHOT must finish being spoken this long before D ends (ms).
      shotBufferMs: 0,

      // Silence from the end of SHOT to the start of NOPE (ms).
      nopeGapMinMs: 150,
      nopeGapMaxMs: 400,

      // Silence from the end of NOPE to the next LEFT/RIGHT (ms).
      afterNopeGapMinMs: 200,
      afterNopeGapMaxMs: 400,

      // Wait after the last window ends before the next start call (ms).
      // Separate from the Drive reset pause.
      resetPauseMs: 1000,

      // Caps. Cut offs are counted per window (they reset after a NOPE).
      maxCutOffsPerWindow: 2,
      maxNopesPerRep: 1,

      // Pick weights, normalized after illegal / non-fitting choices are removed.
      // END in afterShotWeights means the rep ends after that SHOT.
      startWeights: { SPRINT_FROM_PAINT: 25, SPRINT_FROM_LEFT_CORNER: 25, SPRINT_FROM_RIGHT_CORNER: 25, CATCH: 25 },
      afterStartWeights: { LEFT: 50, RIGHT: 50 },
      afterDirectionOrCutOffWeights: { CUT_OFF: 30, SHOT: 70 },
      afterShotWeights: { END: 65, NOPE: 35 },
      afterNopeWeights: { LEFT: 50, RIGHT: 50 },
    },
  };

  // ---- State machine (structure, not tuning) ----

  const AFTER_DRIVE = ["CUT_OFF", "LAY_UP", "LAY_UP_LEFT_SIDE", "LAY_UP_RIGHT_SIDE", "LAY_UP_CENTER_SIDE"];
  const AFTER_LAY_UP = ["CUT_OFF", "LEFT_SIDE", "RIGHT_SIDE", "CENTER_SIDE"];

  const NEXT = {
    READ: ["LEFT", "RIGHT"],
    LEFT: AFTER_DRIVE,
    RIGHT: AFTER_DRIVE,
    CUT_OFF: AFTER_DRIVE,
    LAY_UP: AFTER_LAY_UP,
  };

  const LONG_FINISHERS = ["LAY_UP_LEFT_SIDE", "LAY_UP_RIGHT_SIDE", "LAY_UP_CENTER_SIDE"];
  const SHORT_FINISHERS = ["LEFT_SIDE", "RIGHT_SIDE", "CENTER_SIDE"];
  const FINISHERS = new Set(LONG_FINISHERS.concat(SHORT_FINISHERS));

  const WEIGHT_TABLES = ["startWeights", "afterDriveOrCutOffWeights", "afterLayUpWeights"];

  function weightTableKey(state) {
    if (state === "READ") return "startWeights";
    if (state === "LAY_UP") return "afterLayUpWeights";
    return "afterDriveOrCutOffWeights";
  }

  function cloneSettings(s) {
    return JSON.parse(JSON.stringify(s));
  }

  // Per-phrase spoken length at rate 1.0: learned value when present, else the estimate.
  function durationsFor(s, learned) {
    const dur = {};
    Object.keys(s.phrases).forEach(id => {
      const l = learned && learned[id];
      dur[id] = typeof l === "number" && l > 0 ? l : s.phrases[id].estMs;
    });
    return dur;
  }

  function randomInt(min, max, rng) {
    return Math.floor(rng() * (max - min + 1)) + min;
  }

  function sumOf(ids, map) {
    let total = 0;
    ids.forEach(id => { total += map[id]; });
    return total;
  }

  function cheapest(ids, dur) {
    let best = null;
    ids.forEach(id => {
      if (best === null || dur[id] < dur[best]) best = id;
    });
    return best;
  }

  function cheapestFinisherAfter(state, dur) {
    return cheapest(NEXT[state].filter(id => FINISHERS.has(id)), dur);
  }

  // The single speech rate a call sequence needs inside window D, or null if it
  // cannot fit at maxRate. bufferMs is kept free at the end of the window.
  function fitRateIn(ids, D, bufferMs, s, dur) {
    const avail = D - bufferMs;
    const gaps = (ids.length - 1) * s.minGapMs;
    if (avail <= gaps) return null;
    const rate = Math.max(s.baseRate, sumOf(ids, dur) / (avail - gaps));
    return rate <= s.maxRate + 1e-9 ? rate : null;
  }

  // Smallest window in which a sequence fits at maxRate.
  function minWindowIn(ids, bufferMs, s, dur) {
    return sumOf(ids, dur) / s.maxRate + (ids.length - 1) * s.minGapMs + bufferMs;
  }

  // Drive versions: the finisher buffer is kept free.
  function fitRate(ids, D, s, dur) {
    return fitRateIn(ids, D, s.finisherBufferMs, s, dur);
  }

  function minWindowFor(ids, s, dur) {
    return minWindowIn(ids, s.finisherBufferMs, s, dur);
  }

  function pickWeighted(ids, weights, rng) {
    let total = 0;
    ids.forEach(id => { total += weights[id] || 0; });
    if (!(total > 0)) return null;
    let r = rng() * total;
    for (const id of ids) {
      r -= weights[id] || 0;
      if (r < 0) return id;
    }
    // Float rounding: return the last id with a positive weight.
    for (let i = ids.length - 1; i >= 0; i--) {
      if ((weights[ids[i]] || 0) > 0) return ids[i];
    }
    return null;
  }

  // Lay out a call sequence inside D. Times are ms relative to the window's first
  // call. The last call ends exactly at D - bufferMs; the middle calls are spaced
  // evenly between the first and the last.
  function scheduleCalls(ids, D, rate, bufferMs, dur) {
    const avail = D - bufferMs;
    const calls = ids.map(id => ({ id, startMs: 0, durMs: dur[id] / rate }));
    const last = calls[calls.length - 1];
    last.startMs = avail - last.durMs;

    const middle = calls.slice(1, -1);
    let used = 0;
    middle.forEach(c => { used += c.durMs; });
    const gap = (last.startMs - calls[0].durMs - used) / (middle.length + 1);
    let t = calls[0].durMs;
    middle.forEach(c => {
      t += gap;
      c.startMs = t;
      t += c.durMs;
    });
    return calls;
  }

  // Plan one drive: { D, rate, calls: [{ id, startMs, durMs }] }.
  // onPick(state, legal, survivors, pick) is an optional hook for the self-test.
  function planDrive(s, dur, rng, onPick) {
    rng = rng || Math.random;
    const D = randomInt(s.driveMinMs, s.driveMaxMs, rng);
    const path = [];
    const counts = { CUT_OFF: 0, LAY_UP: 0 };
    let state = "READ";

    for (;;) {
      const legal = NEXT[state];
      const survivors = legal.filter(id => {
        if (id === "CUT_OFF" && counts.CUT_OFF >= s.maxCutOffsPerDrive) return false;
        if (id === "LAY_UP" && counts.LAY_UP >= s.maxLayUpsPerDrive) return false;
        const seq = path.concat(id);
        if (!FINISHERS.has(id)) seq.push(cheapestFinisherAfter(id, dur));
        return fitRate(seq, D, s, dur) !== null;
      });
      if (survivors.length === 0) {
        throw new Error("No call fits after " + state + " in a " + D + " ms drive");
      }

      let pick = pickWeighted(survivors, s[weightTableKey(state)], rng);
      if (pick === null) {
        // Every survivor has weight 0: fall back to the cheapest fitting finisher
        // (or the cheapest drive direction when choosing LEFT/RIGHT).
        const finishers = survivors.filter(id => FINISHERS.has(id));
        pick = cheapest(finishers.length ? finishers : survivors, dur);
      }
      if (onPick) onPick(state, legal, survivors, pick);

      path.push(pick);
      if (pick in counts) counts[pick]++;
      state = pick;
      if (FINISHERS.has(pick)) break;
    }

    const rate = fitRate(path, D, s, dur);
    return { D, rate, calls: scheduleCalls(path, D, rate, s.finisherBufferMs, dur) };
  }

  // One Drive rep: READ at 0, the read time (s.readMinMs..s.readMaxMs, from the
  // shared Min/Max fields), then the drive window, then the reset pause.
  function planDriveRep(s, dur, rng, onPick) {
    rng = rng || Math.random;
    const readMs = randomInt(s.readMinMs, s.readMaxMs, rng);
    const drive = planDrive(s, dur, rng, onPick);
    const calls = [{ id: "READ", atMs: 0, durMs: dur.READ / s.baseRate, rate: s.baseRate }];
    drive.calls.forEach(c => {
      calls.push({ id: c.id, atMs: readMs + c.startMs, durMs: c.durMs, rate: drive.rate });
    });
    return {
      calls,
      windows: [{ startMs: readMs, durMs: drive.D }],
      endMs: readMs + drive.D,
      restMs: s.resetPauseMs,
    };
  }

  // The shortest possible drive: cheapest LEFT/RIGHT plus its cheapest finisher.
  function shortestDrive(dur) {
    const start = cheapest(NEXT.READ, dur);
    return [start, cheapestFinisherAfter(start, dur)];
  }

  function isWhole(n) {
    return Number.isInteger(n);
  }

  function isNonNegative(n) {
    return typeof n === "number" && isFinite(n) && n >= 0;
  }

  const WEIGHT_TABLE_NAMES = {
    startWeights: "Start weights",
    afterDriveOrCutOffWeights: "After LEFT / RIGHT / CUT OFF weights",
    afterLayUpWeights: "After LAY UP weights",
  };

  // Drive settings check. Returns null, or { field: "drive" | "advanced" | "speech", message }.
  // The shared Min/Max read time fields are validated separately.
  function validateOffense(s, dur) {
    const drive = message => ({ field: "drive", message });
    const advanced = message => ({ field: "advanced", message });
    const speech = message => ({ field: "speech", message });

    if (!isWhole(s.driveMinMs) || s.driveMinMs < 600) {
      return drive("Min drive window must be a whole number of at least 600 ms.");
    }
    if (!isWhole(s.driveMaxMs) || s.driveMaxMs < s.driveMinMs) {
      return drive("Min drive window must not exceed max drive window.");
    }
    if (!isNonNegative(s.resetPauseMs)) return advanced("Reset pause must be 0 ms or more.");
    if (!(s.baseRate >= 0.5 && s.baseRate <= 2) || !(s.maxRate >= 0.5 && s.maxRate <= 2)) {
      return speech("Speech rates must be between 0.5 and 2.0.");
    }
    if (s.baseRate > s.maxRate) return speech("Base speech rate must not exceed max speech rate.");
    if (!isNonNegative(s.minGapMs)) return speech("Min gap must be 0 ms or more.");
    if (!isNonNegative(s.finisherBufferMs)) return advanced("Finisher buffer must be 0 ms or more.");
    if (!isNonNegative(s.speechLeadMs)) return speech("Speech lead must be 0 ms or more.");
    if (!isWhole(s.maxCutOffsPerDrive) || s.maxCutOffsPerDrive < 0 || s.maxCutOffsPerDrive > 3) {
      return advanced("Max cut offs per drive must be a whole number from 0 to 3.");
    }
    if (!isWhole(s.maxLayUpsPerDrive) || s.maxLayUpsPerDrive < 0 || s.maxLayUpsPerDrive > 5) {
      return advanced("Max lay ups per drive must be a whole number from 0 to 5.");
    }
    for (const key of WEIGHT_TABLES) {
      const table = s[key];
      const ids = Object.keys(table);
      if (!ids.every(id => isNonNegative(table[id]))) {
        return advanced(WEIGHT_TABLE_NAMES[key] + ": every weight must be a number of 0 or more.");
      }
      if (!(sumOf(ids, table) > 0)) {
        return advanced(WEIGHT_TABLE_NAMES[key] + " must add up to more than 0.");
      }
    }

    const shortest = shortestDrive(dur);
    if (fitRate(shortest, s.driveMinMs, s, dur) === null) {
      const need = Math.ceil(minWindowFor(shortest, s, dur));
      const names = shortest.map(id => s.phrases[id].display).join(" + ");
      return drive("The shortest drive (" + names + ") needs a window of at least " + need +
        " ms at max speech rate " + s.maxRate + ". Raise the min drive window or the max speech rate.");
    }
    return null;
  }

  // New learned length (ms at rate 1.0) after one measurement, or null to ignore it.
  function learnDuration(currentMs, measuredMs, rate, s) {
    const normalized = measuredMs * rate;
    if (!(normalized > 0) || !isFinite(normalized)) return null;
    if (normalized < currentMs * s.learnOutlierLow || normalized > currentMs * s.learnOutlierHigh) return null;
    return currentMs + (normalized - currentMs) * s.learnAlpha;
  }

  // ===================================================================
  // Shooters only drill: start call -> LEFT/RIGHT -> CUT OFF... -> SHOT
  // [-> NOPE -> LEFT/RIGHT -> CUT OFF... -> SHOT]
  // ===================================================================

  const START_CALLS = ["SPRINT_FROM_PAINT", "SPRINT_FROM_LEFT_CORNER", "SPRINT_FROM_RIGHT_CORNER", "CATCH"];
  const DIRECTIONS = ["LEFT", "RIGHT"];
  const AFTER_DIRECTION = ["CUT_OFF", "SHOT"];

  // REP_START is the state before the first call; END (after SHOT) ends the rep.
  const SHOOTERS_NEXT = {
    REP_START: START_CALLS,
    SPRINT_FROM_PAINT: DIRECTIONS,
    SPRINT_FROM_LEFT_CORNER: DIRECTIONS,
    SPRINT_FROM_RIGHT_CORNER: DIRECTIONS,
    CATCH: DIRECTIONS,
    LEFT: AFTER_DIRECTION,
    RIGHT: AFTER_DIRECTION,
    CUT_OFF: AFTER_DIRECTION,
    SHOT: ["END", "NOPE"],
    NOPE: DIRECTIONS,
  };

  const SHOOTERS_WEIGHT_TABLES = [
    "startWeights", "afterStartWeights", "afterDirectionOrCutOffWeights", "afterShotWeights", "afterNopeWeights",
  ];

  function shootersWeightTableKey(state) {
    if (state === "REP_START") return "startWeights";
    if (START_CALLS.indexOf(state) !== -1) return "afterStartWeights";
    if (state === "SHOT") return "afterShotWeights";
    if (state === "NOPE") return "afterNopeWeights";
    return "afterDirectionOrCutOffWeights";
  }

  // Pick the call after `state` among survivors by weight; fallback(survivors)
  // decides when every survivor has weight 0.
  function pickShooters(state, survivors, sh, rng, onPick, fallback) {
    let pick = pickWeighted(survivors, sh[shootersWeightTableKey(state)], rng);
    if (pick === null) pick = fallback(survivors);
    if (onPick) onPick(state, SHOOTERS_NEXT[state], survivors, pick);
    return pick;
  }

  function randomOf(ids, rng) {
    return ids[Math.floor(rng() * ids.length)];
  }

  // Plan one create-space window after `fromState` (a start call or NOPE):
  // { D, rate, calls: [{ id, startMs, durMs }] }, times relative to LEFT/RIGHT.
  // Same math as a drive: one rate per window, SHOT anchored to end at D - shotBufferMs.
  function planShootersWindow(s, dur, rng, fromState, onPick) {
    const sh = s.shooters;
    const D = randomInt(sh.windowMinMs, sh.windowMaxMs, rng);
    const fits = ids => fitRateIn(ids, D, sh.shotBufferMs, s, dur) !== null;

    const dirs = DIRECTIONS.filter(id => fits([id, "SHOT"]));
    if (dirs.length === 0) throw new Error("No direction fits in a " + D + " ms window");
    const path = [pickShooters(fromState, dirs, sh, rng, onPick, ids => randomOf(ids, rng))];

    // Add CUT OFFs one at a time while the cap allows and the path + CUT OFF + SHOT
    // still fits at maxRate, then close with SHOT. No retries needed.
    let cutOffs = 0;
    for (;;) {
      const state = path[path.length - 1];
      const survivors = AFTER_DIRECTION.filter(id =>
        id === "SHOT" || (cutOffs < sh.maxCutOffsPerWindow && fits(path.concat("CUT_OFF", "SHOT"))));
      const pick = pickShooters(state, survivors, sh, rng, onPick, () => "SHOT");
      path.push(pick);
      if (pick === "SHOT") break;
      cutOffs++;
    }

    const rate = fitRateIn(path, D, sh.shotBufferMs, s, dur);
    return { D, rate, calls: scheduleCalls(path, D, rate, sh.shotBufferMs, dur) };
  }

  // One Shooters rep as a rep plan (see PROFILES below).
  function planShootersRep(s, dur, rng, onPick) {
    rng = rng || Math.random;
    const sh = s.shooters;
    const base = s.baseRate;
    const calls = [];
    const windows = [];

    const start = pickShooters("REP_START", START_CALLS, sh, rng, onPick, ids => randomOf(ids, rng));
    const startDur = dur[start] / base;
    calls.push({ id: start, atMs: 0, durMs: startDur, rate: base });

    // Get-set time, measured from the start of the start call. Clamped so the
    // first LEFT/RIGHT can never overlap the start call.
    const getSet = sh.getSetMs[start];
    let t = Math.max(randomInt(getSet.minMs, getSet.maxMs, rng), startDur + s.minGapMs);
    let from = start;
    let nopes = 0;

    for (;;) {
      const w = planShootersWindow(s, dur, rng, from, onPick);
      w.calls.forEach(c => calls.push({ id: c.id, atMs: t + c.startMs, durMs: c.durMs, rate: w.rate }));
      windows.push({ startMs: t, durMs: w.D });

      const after = SHOOTERS_NEXT.SHOT.filter(id => id === "END" || nopes < sh.maxNopesPerRep);
      if (pickShooters("SHOT", after, sh, rng, onPick, () => "END") === "END") {
        return { calls, windows, endMs: t + w.D, restMs: sh.resetPauseMs };
      }

      // NOPE starts a gap after SHOT has finished, so it never cuts SHOT off.
      const shotEnd = t + w.D - sh.shotBufferMs;
      const nopeAt = shotEnd + randomInt(sh.nopeGapMinMs, sh.nopeGapMaxMs, rng);
      const nopeDur = dur.NOPE / base;
      calls.push({ id: "NOPE", atMs: nopeAt, durMs: nopeDur, rate: base });
      nopes++;
      t = nopeAt + nopeDur + randomInt(sh.afterNopeGapMinMs, sh.afterNopeGapMaxMs, rng);
      from = "NOPE";
    }
  }

  // The shortest window: cheapest LEFT/RIGHT plus SHOT.
  function shortestWindow(dur) {
    return [cheapest(DIRECTIONS, dur), "SHOT"];
  }

  function isWholeNonNegative(n) {
    return isWhole(n) && n >= 0;
  }

  // Speech settings shared by both drills. Returns null or { field: "speech", message }.
  function validateSpeech(s) {
    const speech = message => ({ field: "speech", message });
    if (!(s.baseRate >= 0.5 && s.baseRate <= 2) || !(s.maxRate >= 0.5 && s.maxRate <= 2)) {
      return speech("Speech rates must be between 0.5 and 2.0.");
    }
    if (s.baseRate > s.maxRate) return speech("Base speech rate must not exceed max speech rate.");
    if (!isNonNegative(s.minGapMs)) return speech("Min gap must be 0 ms or more.");
    if (!isNonNegative(s.speechLeadMs)) return speech("Speech lead must be 0 ms or more.");
    return null;
  }

  const SHOOTERS_WEIGHT_TABLE_NAMES = {
    startWeights: "Start call weights",
    afterStartWeights: "Weights after the start call",
    afterDirectionOrCutOffWeights: "Weights after LEFT / RIGHT / CUT OFF",
    afterShotWeights: "Weights after SHOT",
    afterNopeWeights: "Weights after NOPE",
  };

  // Shooters settings check. Returns null, or
  // { field: "speech" | "shooters" | "shootersAdvanced", message }.
  function validateShooters(s, dur) {
    const main = message => ({ field: "shooters", message });
    const advanced = message => ({ field: "shootersAdvanced", message });
    const sh = s.shooters;

    const speechError = validateSpeech(s);
    if (speechError) return speechError;

    if (!isWhole(sh.windowMinMs) || sh.windowMinMs < 600) {
      return main("Min window must be a whole number of at least 600 ms.");
    }
    if (!isWhole(sh.windowMaxMs) || sh.windowMaxMs < sh.windowMinMs) {
      return main("Min window must not exceed max window.");
    }
    if (!isWholeNonNegative(sh.resetPauseMs)) return main("Reset pause must be a whole number of 0 ms or more.");

    for (const id of START_CALLS) {
      const range = sh.getSetMs[id];
      const name = "Get-set after " + s.phrases[id].display;
      if (!isWholeNonNegative(range.minMs) || !isWholeNonNegative(range.maxMs)) {
        return advanced(name + ": min and max must be whole numbers of 0 ms or more.");
      }
      if (range.minMs > range.maxMs) return advanced(name + ": min must not exceed max.");
    }
    if (!isWholeNonNegative(sh.shotBufferMs)) return advanced("Shot buffer must be a whole number of 0 ms or more.");
    const ranges = [
      ["Nope gap", sh.nopeGapMinMs, sh.nopeGapMaxMs],
      ["After-nope gap", sh.afterNopeGapMinMs, sh.afterNopeGapMaxMs],
    ];
    for (const r of ranges) {
      if (!isWholeNonNegative(r[1]) || !isWholeNonNegative(r[2])) {
        return advanced(r[0] + ": min and max must be whole numbers of 0 ms or more.");
      }
      if (r[1] > r[2]) return advanced(r[0] + ": min must not exceed max.");
    }
    if (!isWhole(sh.maxCutOffsPerWindow) || sh.maxCutOffsPerWindow < 0 || sh.maxCutOffsPerWindow > 5) {
      return advanced("Max cut offs per window must be a whole number from 0 to 5.");
    }
    if (!isWhole(sh.maxNopesPerRep) || sh.maxNopesPerRep < 0 || sh.maxNopesPerRep > 3) {
      return advanced("Max nopes per rep must be a whole number from 0 to 3.");
    }
    for (const key of SHOOTERS_WEIGHT_TABLES) {
      const table = sh[key];
      const ids = Object.keys(table);
      if (!ids.every(id => isNonNegative(table[id]))) {
        return advanced(SHOOTERS_WEIGHT_TABLE_NAMES[key] + ": every weight must be a number of 0 or more.");
      }
      if (!(sumOf(ids, table) > 0)) {
        return advanced(SHOOTERS_WEIGHT_TABLE_NAMES[key] + " must add up to more than 0.");
      }
    }

    const shortest = shortestWindow(dur);
    if (fitRateIn(shortest, sh.windowMinMs, sh.shotBufferMs, s, dur) === null) {
      const need = Math.ceil(minWindowIn(shortest, sh.shotBufferMs, s, dur));
      const names = shortest.map(id => s.phrases[id].display).join(" + ");
      return main("The shortest window (" + names + ") needs at least " + need +
        " ms at max speech rate " + s.maxRate + ". Raise the min window or the max speech rate.");
    }
    return null;
  }

  // Minimum window needed at maxRate for 0..maxCutOffsPerWindow cut offs.
  function shootersFitTable(s, dur) {
    const sh = s.shooters;
    const rows = [];
    for (let cutOffs = 0; cutOffs <= sh.maxCutOffsPerWindow; cutOffs++) {
      const ids = [cheapest(DIRECTIONS, dur)];
      for (let i = 0; i < cutOffs; i++) ids.push("CUT_OFF");
      ids.push("SHOT");
      const need = Math.ceil(minWindowIn(ids, sh.shotBufferMs, s, dur));
      rows.push({
        cutOffs,
        sequence: ids.map(id => s.phrases[id].display).join(" > "),
        minWindowMs: need,
        fitsAtWindowMax: need <= sh.windowMaxMs ? "yes" : "no",
      });
    }
    return rows;
  }

  // ===================================================================
  // TRAINING_DEFAULTS: session structure (later also logging and progression).
  // A session is everything from Start until the player ends it; it is made of
  // sets, and a set is a fixed number of reps (one rep plan each).
  // The start screen shows these as defaults; saved values override them.
  // ===================================================================
  const TRAINING_DEFAULTS = {
    // Reps in one set (whole number 3-30). The set ends at the last rep's endMs.
    repsPerSet: 8,

    // Planned sets per session (whole number 1-20). A target shown on the game
    // screen ("SET 2 / 4"), not a hard stop: the player can keep going.
    plannedSets: 4,

    // Minutes after Start when a fatigue warning banner appears. 0 = off.
    // The session is never stopped automatically.
    sessionWarningMin: 45, // provisional

    // Spoken when a set ends (at baseRate, queued behind the last call, never cancelling it).
    setDoneSpoken: "set done",
  };

  // Session settings check. Returns null, or { field: "session", message }.
  function validateSession(t) {
    const session = message => ({ field: "session", message });
    if (!isWhole(t.repsPerSet) || t.repsPerSet < 3 || t.repsPerSet > 30) {
      return session("Reps per set must be a whole number from 3 to 30.");
    }
    if (!isWhole(t.plannedSets) || t.plannedSets < 1 || t.plannedSets > 20) {
      return session("Planned sets must be a whole number from 1 to 20.");
    }
    if (!isWholeNonNegative(t.sessionWarningMin)) {
      return session("Session time warning must be a whole number of 0 minutes or more (0 = off).");
    }
    return null;
  }

  // Session progress { set, rep }: the current set (from 1) and the reps started in it.
  function newSession() {
    return { set: 1, rep: 0 };
  }

  function beginRep(p) {
    return { set: p.set, rep: p.rep + 1 };
  }

  // True once the rep just begun is the set's last one.
  function isSetComplete(p, t) {
    return p.rep >= t.repsPerSet;
  }

  function beginSet(p) {
    return { set: p.set + 1, rep: 0 };
  }

  // "SET 2 / 4 · REP 5 / 8". Sets past the plan keep counting ("SET 5 / 4").
  function progressLabel(p, t) {
    return "SET " + p.set + " / " + t.plannedSets + " · REP " + p.rep + " / " + t.repsPerSet;
  }

  // Elapsed session time as mm:ss (minutes keep counting past 59, e.g. "75:03").
  function formatElapsed(ms) {
    const total = Math.max(0, Math.floor(ms / 1000));
    return String(Math.floor(total / 60)).padStart(2, "0") + ":" + String(total % 60).padStart(2, "0");
  }

  function sessionWarningDue(elapsedMs, t) {
    return t.sessionWarningMin > 0 && elapsedMs >= t.sessionWarningMin * 60000;
  }

  function sessionWarningText(t) {
    return t.sessionWarningMin + " min: decision quality and technique drop with fatigue. " +
      "Consider finishing this set and stopping.";
  }

  // ---- Self-test support (only called from ?selftest=1) ----

  // Session helpers self-test.
  function trainingSelfTest(check) {
    const t = Object.assign({}, TRAINING_DEFAULTS);
    const err = validateSession(t);
    check("session: defaults pass validation", err ? [err.message] : []);

    const bad = [
      { repsPerSet: 2 }, { repsPerSet: 31 }, { repsPerSet: 8.5 }, { repsPerSet: NaN },
      { plannedSets: 0 }, { plannedSets: 21 }, { plannedSets: 1.5 }, { plannedSets: NaN },
      { sessionWarningMin: -1 }, { sessionWarningMin: 2.5 }, { sessionWarningMin: NaN },
    ];
    const good = [
      { repsPerSet: 3 }, { repsPerSet: 30 }, { plannedSets: 1 }, { plannedSets: 20 }, { sessionWarningMin: 0 },
    ];
    const vf = [];
    bad.forEach(c => {
      const e = validateSession(Object.assign({}, t, c));
      if (!e || e.field !== "session") vf.push("accepted " + JSON.stringify(c));
    });
    good.forEach(c => {
      if (validateSession(Object.assign({}, t, c))) vf.push("rejected " + JSON.stringify(c));
    });
    check("session: validation rejects out-of-range or non-whole values, accepts the bounds", vf);

    // Walk 6 sets (past the 4 planned) for several set sizes.
    const cf = [];
    [3, 8, 30].forEach(repsPerSet => {
      const ts = Object.assign({}, t, { repsPerSet });
      let p = newSession();
      for (let set = 1; set <= 6; set++) {
        if (p.set !== set || p.rep !== 0 || isSetComplete(p, ts)) cf.push(repsPerSet + ": bad start of set " + set);
        let reps = 0;
        do {
          p = beginRep(p);
          reps++;
          const want = "SET " + set + " / 4 · REP " + reps + " / " + repsPerSet;
          if (progressLabel(p, ts) !== want) cf.push(progressLabel(p, ts) + " (want " + want + ")");
        } while (!isSetComplete(p, ts) && reps < 100);
        if (reps !== repsPerSet) cf.push(repsPerSet + ": set " + set + " had " + reps + " reps");
        p = beginSet(p);
      }
    });
    check("session: each set ends after exactly repsPerSet reps, labels count sets and reps", cf);

    const ff = [];
    [[0, "00:00"], [999, "00:00"], [1000, "00:01"], [59999, "00:59"], [60000, "01:00"],
     [754000, "12:34"], [3600000, "60:00"], [4503000, "75:03"], [-5, "00:00"]].forEach(c => {
      if (formatElapsed(c[0]) !== c[1]) ff.push(c[0] + " ms -> " + formatElapsed(c[0]) + " (want " + c[1] + ")");
    });
    check("session: elapsed time formats as mm:ss", ff);

    const wf = [];
    const t45 = Object.assign({}, t, { sessionWarningMin: 45 });
    const off = Object.assign({}, t, { sessionWarningMin: 0 });
    if (sessionWarningDue(45 * 60000 - 1, t45)) wf.push("due before 45 min");
    if (!sessionWarningDue(45 * 60000, t45) || !sessionWarningDue(90 * 60000, t45)) wf.push("not due at/after 45 min");
    if (sessionWarningDue(0, off) || sessionWarningDue(1e9, off)) wf.push("due while off (0)");
    if (sessionWarningText(t45).indexOf("45 min: decision quality") !== 0) wf.push("text: " + sessionWarningText(t45));
    check("session: fatigue warning due only at or after the set minutes, never when 0", wf);
  }

  // Minimum drive window needed at maxRate for 0-3 cut-offs and each finisher.
  function fitTable(s, dur) {
    const start = NEXT.READ.reduce((a, b) => (dur[b] < dur[a] ? b : a));
    const rows = [];
    for (let cutOffs = 0; cutOffs <= 3; cutOffs++) {
      LONG_FINISHERS.concat(SHORT_FINISHERS).forEach(fin => {
        const ids = [start];
        for (let i = 0; i < cutOffs; i++) ids.push("CUT_OFF");
        if (SHORT_FINISHERS.indexOf(fin) !== -1) ids.push("LAY_UP");
        ids.push(fin);
        const need = Math.ceil(minWindowFor(ids, s, dur));
        rows.push({
          cutOffs,
          finisher: s.phrases[fin].display,
          sequence: ids.map(id => s.phrases[id].display).join(" > "),
          minWindowMs: need,
          fitsAtDriveMax: need <= s.driveMaxMs ? "yes" : "no",
        });
      });
    }
    return rows;
  }

  const EPS = 1e-6;

  // Drive self-test. check(name, failures) records one PASS/FAIL line.
  function driveSelfTest(check, drives) {
    const defaults = cloneSettings(OFFENSE_DEFAULTS);
    const dur = durationsFor(defaults, null);
    const tight = Object.assign(cloneSettings(defaults), { driveMinMs: 1400, driveMaxMs: 1400, maxRate: 2, minGapMs: 40 });
    const loose = Object.assign(cloneSettings(defaults), { driveMinMs: 30000, driveMaxMs: 30000, maxRate: 2 });

    [["default", defaults], ["tight", tight]].forEach(pair => {
      const label = pair[0];
      const s = pair[1];
      const settingsError = validateOffense(s, dur);
      check(label + ": settings pass validation", settingsError ? [settingsError.message] : []);

      const f = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], plan: [] };
      for (let n = 0; n < drives; n++) {
        let plan;
        try {
          plan = planDrive(s, dur, Math.random);
        } catch (e) {
          f.plan.push(e.message);
          continue;
        }
        const ids = plan.calls.map(c => c.id);
        const where = ids.join(" > ");

        if (NEXT.READ.indexOf(ids[0]) === -1) f[1].push(where);

        const seq = ["READ"].concat(ids);
        for (let i = 1; i < seq.length; i++) {
          if (FINISHERS.has(seq[i - 1]) || !NEXT[seq[i - 1]] || NEXT[seq[i - 1]].indexOf(seq[i]) === -1) {
            f[2].push(where);
            break;
          }
        }

        const last = ids[ids.length - 1];
        const prev = ids[ids.length - 2];
        const expected = prev === "LAY_UP" ? SHORT_FINISHERS : LONG_FINISHERS;
        if (ids.filter(id => FINISHERS.has(id)).length !== 1 || expected.indexOf(last) === -1) f[3].push(where);

        const cuts = ids.filter(id => id === "CUT_OFF").length;
        const layUps = ids.filter(id => id === "LAY_UP").length;
        if (cuts > s.maxCutOffsPerDrive || layUps > s.maxLayUpsPerDrive) f[4].push(where);

        if (plan.D < s.driveMinMs || plan.D > s.driveMaxMs ||
            plan.rate < s.baseRate - EPS || plan.rate > s.maxRate + EPS) {
          f[5].push("D=" + plan.D + " rate=" + plan.rate);
        }

        const avail = plan.D - s.finisherBufferMs;
        plan.calls.forEach((c, i) => {
          const end = c.startMs + c.durMs;
          if (c.startMs < -EPS || end > avail + EPS) f[6].push(where + " (" + c.id + " outside window)");
          if (i > 0) {
            const p = plan.calls[i - 1];
            const gap = c.startMs - (p.startMs + p.durMs);
            if (gap < s.minGapMs - EPS) f[6].push(where + " (gap " + gap.toFixed(1) + " ms)");
          }
        });
      }

      check(label + ": every drive could be planned", f.plan);
      check(label + ": 1. drive starts with LEFT or RIGHT after READ", f[1]);
      check(label + ": 2. every transition is legal, nothing after a finisher", f[2]);
      check(label + ": 3. exactly one finisher, legal for the previous call", f[3]);
      check(label + ": 4. cut-offs <= " + s.maxCutOffsPerDrive + ", lay-ups <= " + s.maxLayUpsPerDrive, f[4]);
      check(label + ": 5. D within drive window, rate within base..max", f[5]);
      check(label + ": 6. calls inside [0, D - buffer], no overlap, gaps >= minGap", f[6]);
    });

    // 7. With loose timing, picks made with every legal choice available
    // should match the weights.
    const tallies = {};
    for (let n = 0; n < drives * 4; n++) {
      planDrive(loose, dur, Math.random, (state, legal, survivors, pick) => {
        if (survivors.length !== legal.length) return;
        const key = weightTableKey(state);
        tallies[key] = tallies[key] || { total: 0, picks: {} };
        tallies[key].total++;
        tallies[key].picks[pick] = (tallies[key].picks[pick] || 0) + 1;
      });
    }
    const freqFailures = [];
    WEIGHT_TABLES.forEach(key => {
      const table = loose[key];
      const weightSum = sumOf(Object.keys(table), table);
      const t = tallies[key];
      if (!t) {
        freqFailures.push(key + ": no samples");
        return;
      }
      Object.keys(table).forEach(id => {
        const want = table[id] / weightSum;
        const got = (t.picks[id] || 0) / t.total;
        if (Math.abs(got - want) > 0.02) {
          freqFailures.push(key + "." + id + " expected " + want.toFixed(3) + " got " + got.toFixed(3));
        }
      });
    });
    check("loose: 7. pick frequencies match the weights (within 2 points)", freqFailures);

    // The rep wrapper the runner executes: READ at 0, then the drive inside its window.
    const repSettings = Object.assign(cloneSettings(defaults), { readMinMs: 1000, readMaxMs: 3000 });
    const repFailures = [];
    for (let n = 0; n < drives; n++) {
      const rep = planDriveRep(repSettings, dur, Math.random);
      const w = rep.windows[0];
      const first = rep.calls[0];
      if (first.id !== "READ" || first.atMs !== 0 || first.rate !== repSettings.baseRate) repFailures.push("READ not first");
      if (rep.windows.length !== 1 || w.startMs < 1000 || w.startMs > 3000) repFailures.push("read time " + w.startMs);
      if (rep.calls[1].atMs !== w.startMs) repFailures.push("LEFT/RIGHT not at window start");
      if (rep.endMs !== w.startMs + w.durMs || rep.restMs !== repSettings.resetPauseMs) repFailures.push("endMs/restMs");
      rep.calls.slice(1).forEach(c => {
        if (c.atMs < w.startMs - EPS || c.atMs + c.durMs > w.startMs + w.durMs + EPS) repFailures.push(c.id + " outside window");
      });
    }
    check("drive rep: READ at 0, read time in range, calls inside the window", repFailures);

    return fitTable(defaults, dur);
  }

  // Shooters self-test. Splits each rep into its windows by structure: a window
  // starts at the LEFT/RIGHT after the start call or after a NOPE.
  function shootersSelfTest(check, reps) {
    const defaults = cloneSettings(OFFENSE_DEFAULTS);
    const dur = durationsFor(defaults, null);
    const variant = (top, sh) => {
      const s = Object.assign(cloneSettings(defaults), top);
      Object.assign(s.shooters, sh);
      return s;
    };
    const tight = variant({ maxRate: 2, minGapMs: 40 }, { windowMinMs: 1000, windowMaxMs: 1000 });
    const loose = variant({ maxRate: 2 }, { windowMinMs: 30000, windowMaxMs: 30000 });
    const fmt = ms => ms.toFixed(1);

    [["default", defaults], ["tight", tight]].forEach(pair => {
      const label = "shooters " + pair[0];
      const s = pair[1];
      const sh = s.shooters;
      const settingsError = validateShooters(s, dur);
      check(label + ": settings pass validation", settingsError ? [settingsError.message] : []);

      const f = { plan: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: [], 8: [] };
      for (let n = 0; n < reps; n++) {
        let rep;
        try {
          rep = planShootersRep(s, dur, Math.random);
        } catch (e) {
          f.plan.push(e.message);
          continue;
        }
        const calls = rep.calls;
        const ids = calls.map(c => c.id);
        const where = ids.join(" > ");

        // 1. Start call, then LEFT/RIGHT.
        if (START_CALLS.indexOf(ids[0]) === -1 || DIRECTIONS.indexOf(ids[1]) === -1) f[1].push(where);

        // 2. Every transition is in the state table; NOPE only right after SHOT.
        const seq = ["REP_START"].concat(ids, "END");
        for (let i = 1; i < seq.length; i++) {
          const allowed = SHOOTERS_NEXT[seq[i - 1]];
          if (!allowed || allowed.indexOf(seq[i]) === -1) {
            f[2].push(where);
            break;
          }
        }
        if (ids.some((id, i) => id === "NOPE" && ids[i - 1] !== "SHOT")) f[2].push(where + " (NOPE not after SHOT)");

        // Split into windows and NOPEs.
        const groups = [];
        const nopes = [];
        calls.slice(1).forEach(c => {
          if (c.id === "NOPE") nopes.push(c);
          else if (DIRECTIONS.indexOf(c.id) !== -1 && (groups.length === 0 || groups[groups.length - 1].done)) groups.push({ calls: [c] });
          else if (groups.length) groups[groups.length - 1].calls.push(c);
          if (c.id === "SHOT" && groups.length) groups[groups.length - 1].done = true;
        });

        // 3. Each window: exactly one SHOT, last; the rep ends right after a SHOT.
        if (groups.length !== rep.windows.length || ids[ids.length - 1] !== "SHOT") f[3].push(where);
        groups.forEach(g => {
          const shots = g.calls.filter(c => c.id === "SHOT").length;
          if (shots !== 1 || g.calls[g.calls.length - 1].id !== "SHOT") f[3].push(where);
        });
        const lastWin = rep.windows[rep.windows.length - 1];
        if (rep.endMs !== lastWin.startMs + lastWin.durMs) f[3].push(where + " (endMs)");

        // 4. Caps.
        if (groups.some(g => g.calls.filter(c => c.id === "CUT_OFF").length > sh.maxCutOffsPerWindow) ||
            nopes.length > sh.maxNopesPerRep) {
          f[4].push(where);
        }

        // 5. Window timing.
        groups.forEach((g, k) => {
          const w = rep.windows[k];
          if (!w) return;
          const rate = g.calls[0].rate;
          if (w.durMs < sh.windowMinMs || w.durMs > sh.windowMaxMs || !isWhole(w.durMs) ||
              rate < s.baseRate - EPS || rate > s.maxRate + EPS || g.calls.some(c => c.rate !== rate)) {
            f[5].push(where + " (D=" + w.durMs + " rate=" + rate + ")");
          }
          if (g.calls[0].atMs !== w.startMs) f[5].push(where + " (window does not start at LEFT/RIGHT)");
          const availEnd = w.startMs + w.durMs - sh.shotBufferMs;
          g.calls.forEach((c, i) => {
            if (c.atMs < w.startMs - EPS || c.atMs + c.durMs > availEnd + EPS) f[5].push(where + " (" + c.id + " outside window)");
            if (i > 0) {
              const p = g.calls[i - 1];
              const gap = c.atMs - (p.atMs + p.durMs);
              if (gap < s.minGapMs - EPS) f[5].push(where + " (gap " + fmt(gap) + " ms)");
            }
          });
          const shot = g.calls[g.calls.length - 1];
          if (Math.abs(shot.atMs + shot.durMs - availEnd) > EPS) f[5].push(where + " (SHOT not ending at D - buffer)");
        });

        // 6. NOPE timing: after SHOT ends, then the next LEFT/RIGHT after NOPE ends.
        nopes.forEach(nope => {
          const i = calls.indexOf(nope);
          const shot = calls[i - 1];
          const next = calls[i + 1];
          const gap = nope.atMs - (shot.atMs + shot.durMs);
          if (gap < sh.nopeGapMinMs - EPS || gap > sh.nopeGapMaxMs + EPS) f[6].push(where + " (nope gap " + fmt(gap) + ")");
          const after = next ? next.atMs - (nope.atMs + nope.durMs) : NaN;
          if (!(after >= sh.afterNopeGapMinMs - EPS && after <= sh.afterNopeGapMaxMs + EPS)) {
            f[6].push(where + " (after-nope gap " + after + ")");
          }
        });

        // 7. Get-set: first LEFT/RIGHT after the start call, within the clamped range.
        const startDur = dur[ids[0]] / s.baseRate;
        const clamp = startDur + s.minGapMs;
        const range = sh.getSetMs[ids[0]];
        const first = calls[1].atMs;
        if (first < clamp - EPS || first < range.minMs - EPS || first > Math.max(range.maxMs, clamp) + EPS) {
          f[7].push(where + " (first LEFT/RIGHT at " + fmt(first) + ")");
        }

        // 8. Rep shape: start call and NOPE at baseRate, nothing overlaps, rest pause.
        if (calls[0].atMs !== 0 || calls[0].rate !== s.baseRate || nopes.some(c => c.rate !== s.baseRate)) {
          f[8].push(where + " (start call / NOPE rate)");
        }
        for (let i = 1; i < calls.length; i++) {
          if (calls[i].atMs < calls[i - 1].atMs + calls[i - 1].durMs - EPS) f[8].push(where + " (overlap at " + calls[i].id + ")");
        }
        if (rep.restMs !== sh.resetPauseMs) f[8].push(where + " (restMs)");
      }

      check(label + ": every rep could be planned", f.plan);
      check(label + ": 1. rep starts with a start call, then LEFT or RIGHT", f[1]);
      check(label + ": 2. every transition is legal, NOPE only right after SHOT", f[2]);
      check(label + ": 3. each window ends with its one SHOT, the rep ends after a SHOT", f[3]);
      check(label + ": 4. cut offs per window <= " + sh.maxCutOffsPerWindow + ", nopes per rep <= " + sh.maxNopesPerRep, f[4]);
      check(label + ": 5. D in range, rate base..max, calls inside window, gaps >= minGap, SHOT ends at D - buffer", f[5]);
      check(label + ": 6. NOPE " + sh.nopeGapMinMs + "-" + sh.nopeGapMaxMs + " ms after SHOT ends, next call " +
        sh.afterNopeGapMinMs + "-" + sh.afterNopeGapMaxMs + " ms after NOPE ends", f[6]);
      check(label + ": 7. first LEFT/RIGHT >= start call + minGap and within the get-set range", f[7]);
      check(label + ": 8. start call and NOPE at baseRate, no overlaps in the rep, rest = reset pause", f[8]);
    });

    // 9. With loose timing, picks made with every legal choice available
    // should match the weights.
    const tallies = {};
    for (let n = 0; n < reps * 4; n++) {
      planShootersRep(loose, dur, Math.random, (state, legal, survivors, pick) => {
        if (survivors.length !== legal.length) return;
        const key = shootersWeightTableKey(state);
        tallies[key] = tallies[key] || { total: 0, picks: {} };
        tallies[key].total++;
        tallies[key].picks[pick] = (tallies[key].picks[pick] || 0) + 1;
      });
    }
    const freqFailures = [];
    SHOOTERS_WEIGHT_TABLES.forEach(key => {
      const table = loose.shooters[key];
      const weightSum = sumOf(Object.keys(table), table);
      const t = tallies[key];
      if (!t) {
        freqFailures.push(key + ": no samples");
        return;
      }
      Object.keys(table).forEach(id => {
        const want = table[id] / weightSum;
        const got = (t.picks[id] || 0) / t.total;
        if (Math.abs(got - want) > 0.02) {
          freqFailures.push(key + "." + id + " expected " + want.toFixed(3) + " got " + got.toFixed(3));
        }
      });
    });
    check("shooters loose: 9. pick frequencies match the weights (within 2 points)", freqFailures);

    return shootersFitTable(defaults, dur);
  }

  // ---- Drill profiles ----
  // A profile bundles one drill: its phrase ids, state table, weight tables,
  // a pure planRep(settings, durations, rng), validate(settings, durations),
  // its fit table and its self-test. Phrases (and learned lengths) are shared by id.
  //
  // planRep returns one rep plan, the only shape the runner executes:
  //   {
  //     calls:   [{ id, atMs, durMs, rate }],  // every spoken call, ms from the rep start
  //     windows: [{ startMs, durMs }],         // countdown windows the bar draws
  //     endMs,                                 // when the rep's last window ends
  //     restMs                                 // pause after endMs before the next rep
  //   }
  // A future mixed drill only has to pick a profile per rep and call its planRep.
  const PROFILES = {
    drive: {
      id: "drive",
      phraseIds: ["READ"].concat(NEXT.READ, AFTER_DRIVE, SHORT_FINISHERS),
      next: NEXT,
      weightTables: WEIGHT_TABLES,
      planRep: planDriveRep,
      validate: validateOffense,
      fitTable,
      selfTest: driveSelfTest,
    },
    shooters: {
      id: "shooters",
      phraseIds: START_CALLS.concat(DIRECTIONS, AFTER_DIRECTION, "NOPE"),
      next: SHOOTERS_NEXT,
      weightTables: SHOOTERS_WEIGHT_TABLES,
      planRep: planShootersRep,
      validate: validateShooters,
      fitTable: shootersFitTable,
      selfTest: shootersSelfTest,
    },
  };

  // Runs every profile's self-test. Returns { passed, results, fitTables: { drive, … } }.
  function runSelfTest(log, reps) {
    reps = reps || 10000;
    const results = [];
    const check = (name, failures) => {
      const ok = failures.length === 0;
      results.push({ name, ok });
      log((ok ? "PASS  " : "FAIL  ") + name + (ok ? "" : "  (" + failures.length + " failures, e.g. " + failures[0] + ")"));
    };

    const fitTables = {};
    Object.keys(PROFILES).forEach(id => {
      fitTables[id] = PROFILES[id].selfTest(check, reps);
    });
    trainingSelfTest(check);

    const passed = results.every(r => r.ok);
    log((passed ? "ALL PASS" : "SOME CHECKS FAILED") + " (" + results.filter(r => r.ok).length + "/" + results.length + ")");
    return { passed, results, fitTable: fitTables.drive, fitTables };
  }

  return {
    OFFENSE_DEFAULTS,
    NEXT,
    FINISHERS,
    LONG_FINISHERS,
    SHORT_FINISHERS,
    WEIGHT_TABLES,
    PROFILES,
    cloneSettings,
    durationsFor,
    learnDuration,
    fitRate,
    minWindowFor,
    planDrive,
    planDriveRep,
    validateOffense,
    fitTable,
    START_CALLS,
    SHOOTERS_NEXT,
    SHOOTERS_WEIGHT_TABLES,
    planShootersRep,
    validateShooters,
    shootersFitTable,
    TRAINING_DEFAULTS,
    validateSession,
    newSession,
    beginRep,
    isSetComplete,
    beginSet,
    progressLabel,
    formatElapsed,
    sessionWarningDue,
    sessionWarningText,
    runSelfTest,
  };
})();
</script>
<script>
(function () {
  // ?selftest=1 runs the simulation (last script below) instead of the app.
  if (new URLSearchParams(window.location.search).get("selftest") === "1") return;

  const WORDS = ["Left", "Right", "Up", "Back"];
  const WORD_CLASS = { Left: "word-left", Right: "word-right", Up: "word-up", Back: "word-back" };

  const P = OffensePlanner;
  const OFFENSE_DEFAULTS = P.OFFENSE_DEFAULTS;

  // Offense colors by meaning: side named -> that side's color.
  const PHRASE_CLASS = {
    READ: "word-read",
    LEFT: "word-left", LEFT_SIDE: "word-left", LAY_UP_LEFT_SIDE: "word-left",
    RIGHT: "word-right", RIGHT_SIDE: "word-right", LAY_UP_RIGHT_SIDE: "word-right",
    CENTER_SIDE: "word-center", LAY_UP_CENTER_SIDE: "word-center",
    CUT_OFF: "word-cut",
    LAY_UP: "word-layup",
    SPRINT_FROM_PAINT: "word-sprint", SPRINT_FROM_LEFT_CORNER: "word-sprint", SPRINT_FROM_RIGHT_CORNER: "word-sprint",
    CATCH: "word-catch",
    SHOT: "word-shot",
    NOPE: "word-nope",
  };

  const WEIGHT_TABLE_TITLES = {
    startWeights: "Start weights (after READ)",
    afterDriveOrCutOffWeights: "Weights after LEFT / RIGHT / CUT OFF",
    afterLayUpWeights: "Weights after LAY UP",
  };

  const SHOOTERS_WEIGHT_TABLE_TITLES = {
    startWeights: "Start call weights",
    afterStartWeights: "Weights after the start call",
    afterDirectionOrCutOffWeights: "Weights after LEFT / RIGHT / CUT OFF",
    afterShotWeights: "Weights after SHOT",
    afterNopeWeights: "Weights after NOPE",
  };

  // Short labels for the Shooters form (the full phrases are too wide for two columns).
  const SHORT_LABELS = {
    SPRINT_FROM_PAINT: "From paint",
    SPRINT_FROM_LEFT_CORNER: "From left corner",
    SPRINT_FROM_RIGHT_CORNER: "From right corner",
    CATCH: "Catch",
    END: "END (rep ends)",
  };

  // Offense drills (OffensePlanner.PROFILES ids). A future "mixed" drill goes here too.
  const DRILLS = {
    drive: {
      label: "OFFENSE · DRIVE",
      subtitle: "Read the court, drive, react to the defense, and finish before the clock runs out.",
    },
    shooters: {
      label: "OFFENSE · SHOOTERS",
      subtitle: "Sprint to your spot or catch, create space, and shoot when you're open.",
    },
  };

  const startScreen = document.getElementById("startScreen");
  const gameScreen = document.getElementById("gameScreen");
  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const minMsInput = document.getElementById("minMs");
  const maxMsInput = document.getElementById("maxMs");
  const rangeError = document.getElementById("rangeError");
  const wordEl = document.getElementById("word");
  const subtitleEl = document.getElementById("subtitle");
  const minMsLabel = document.getElementById("minMsLabel");
  const maxMsLabel = document.getElementById("maxMsLabel");
  const modeLabel = document.getElementById("modeLabel");
  const modeButtons = document.querySelectorAll(".segmented button[data-mode]");
  const drillButtons = document.querySelectorAll(".segmented button[data-drill]");
  const rangePanel = document.getElementById("rangePanel");
  const offensePanel = document.getElementById("offensePanel");
  const driveSettings = document.getElementById("driveSettings");
  const shootersSettings = document.getElementById("shootersSettings");
  const driveError = document.getElementById("driveError");
  const advancedEl = document.getElementById("advanced");
  const advancedError = document.getElementById("advancedError");
  const weightTablesEl = document.getElementById("weightTables");
  const shootersError = document.getElementById("shootersError");
  const shootersAdvancedEl = document.getElementById("shootersAdvanced");
  const shootersAdvancedError = document.getElementById("shootersAdvancedError");
  const shootersWeightTablesEl = document.getElementById("shootersWeightTables");
  const getSetFieldsEl = document.getElementById("getSetFields");
  const speechEl = document.getElementById("speech");
  const speechError = document.getElementById("speechError");
  const countdownEl = document.getElementById("countdown");
  const countdownFill = document.getElementById("countdownFill");
  const countdownText = document.getElementById("countdownText");
  const sessionError = document.getElementById("sessionError");
  const sessionBanner = document.getElementById("sessionBanner");
  const sessionClock = document.getElementById("sessionClock");
  const sessionProgress = document.getElementById("sessionProgress");
  const setScreen = document.getElementById("setScreen");
  const setScreenLabel = document.getElementById("setScreenLabel");
  const setDoneText = document.getElementById("setDoneText");
  const nextSetBtn = document.getElementById("nextSetBtn");
  const endSessionBtn = document.getElementById("endSessionBtn");

  const STORAGE_MODE = "reactionCaller.mode";
  const STORAGE_DRILL = "reactionCaller.offenseDrill";
  const STORAGE_SETTINGS = "reactionCaller.settings";
  const STORAGE_LEARNED = "reactionCaller.learnedMs";

  // Where each validation error is shown (and which <details> to open for it).
  const ERROR_TARGETS = {
    drive: { el: driveError },
    advanced: { el: advancedError, details: advancedEl },
    speech: { el: speechError, details: speechEl },
    shooters: { el: shootersError },
    shootersAdvanced: { el: shootersAdvancedError, details: shootersAdvancedEl },
    session: { el: sessionError },
  };

  let voices = [];
  let selectedMode = "defense";
  let selectedDrill = "drive";
  let activeMode = null;

  function storageGet(key) {
    try {
      return window.localStorage.getItem(key);
    } catch (e) {
      return null;
    }
  }

  function storageSet(key, value) {
    try {
      window.localStorage.setItem(key, value);
    } catch (e) {}
  }

  function loadVoices() {
    voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  }
  if (window.speechSynthesis) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function pickVoice() {
    return voices.find(v => v.lang && v.lang.startsWith("en")) || voices[0] || null;
  }

  // Defense cancels before every call (newest call always wins). Offense passes
  // cancel: false so calls queue instead of clipping; it only cancels on Stop.
  function speak(text, options) {
    const opts = options || {};
    if (!window.speechSynthesis) return null;
    if (opts.cancel !== false) window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const voice = pickVoice();
    if (voice) utter.voice = voice;
    utter.rate = opts.rate || 1;
    utter.pitch = 1;
    window.speechSynthesis.speak(utter);
    return utter;
  }

  function validateRange() {
    const offense = selectedMode === "offense";
    const min = parseInt(minMsInput.value, 10);
    const max = parseInt(maxMsInput.value, 10);
    if (isNaN(min) || isNaN(max) || min < 100 || max < 100) {
      rangeError.textContent = "Enter values of at least 100ms.";
      return null;
    }
    if (min > max) {
      rangeError.textContent = offense
        ? "Min read time must not exceed max read time."
        : "Min delay must not exceed max delay.";
      return null;
    }
    rangeError.textContent = "";
    return { min, max };
  }

  function randomDelay(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function showWord(text, className) {
    wordEl.textContent = text;
    wordEl.className = className || "";
    wordEl.classList.remove("show");
    void wordEl.offsetWidth;
    wordEl.classList.add("show");
  }

  function primeSpeech() {
    if (!window.speechSynthesis) return;
    const primer = new SpeechSynthesisUtterance(" ");
    primer.volume = 0;
    window.speechSynthesis.speak(primer);
  }

  // ---- Defense mode: random Left / Right / Up / Back ----

  const defenseMode = {
    timerId: null,

    start(settings) {
      this.scheduleNext(settings.min, settings.max);
    },

    scheduleNext(min, max) {
      this.timerId = setTimeout(() => {
        const word = WORDS[Math.floor(Math.random() * WORDS.length)];
        showWord(word, WORD_CLASS[word]);
        speak(word);
        this.scheduleNext(min, max);
      }, randomDelay(min, max));
    },

    stop() {
      if (this.timerId !== null) {
        clearTimeout(this.timerId);
        this.timerId = null;
      }
    },
  };

  // ---- Offense mode: READ -> LEFT/RIGHT -> CUT OFF / LAY UP ... -> finisher ----

  // Learned spoken lengths per phrase (ms at rate 1.0), kept in localStorage.
  function loadLearned() {
    let stored = null;
    try {
      stored = JSON.parse(storageGet(STORAGE_LEARNED));
    } catch (e) {}
    const learned = {};
    if (stored && typeof stored === "object") {
      Object.keys(OFFENSE_DEFAULTS.phrases).forEach(id => {
        if (typeof stored[id] === "number" && stored[id] > 0) learned[id] = stored[id];
      });
    }
    return learned;
  }

  let learnedMs = loadLearned();

  function recordSpokenLength(id, measuredMs, rate, settings) {
    const current = learnedMs[id] || settings.phrases[id].estMs;
    const next = P.learnDuration(current, measuredMs, rate, settings);
    if (next === null) return;
    learnedMs[id] = Math.round(next);
    storageSet(STORAGE_LEARNED, JSON.stringify(learnedMs));
  }

  function renderCountdown(remainingMs, totalMs) {
    countdownFill.style.transform = "scaleX(" + (totalMs > 0 ? remainingMs / totalMs : 0) + ")";
    countdownText.textContent = (remainingMs / 1000).toFixed(1) + " s";
  }

  // Runs rep plans from the active drill profile (see OffensePlanner.PROFILES),
  // grouped into sets of settings.training.repsPerSet reps.
  const offenseMode = {
    settings: null,
    profile: null,
    timers: [],
    rafId: null,
    runId: 0,
    progress: null,
    sessionStart: 0,
    clockId: null,
    warned: false,

    start(settings) {
      this.settings = settings;
      this.profile = P.PROFILES[settings.drill];
      this.runId++;
      this.progress = P.newSession();
      countdownEl.classList.remove("hidden");
      this.startClock();
      this.startRep();
    },

    // Session clock (mm:ss) and the one-time fatigue warning. Runs for the
    // whole session, including the set complete screen, until Stop.
    startClock() {
      const t = this.settings.training;
      this.sessionStart = performance.now();
      this.warned = false;
      sessionBanner.classList.add("hidden");
      const tick = () => {
        const elapsed = performance.now() - this.sessionStart;
        sessionClock.textContent = P.formatElapsed(elapsed);
        if (!this.warned && P.sessionWarningDue(elapsed, t)) {
          this.warned = true;
          sessionBanner.textContent = P.sessionWarningText(t);
          sessionBanner.classList.remove("hidden");
        }
      };
      tick();
      this.clockId = setInterval(tick, 250);
    },

    // Called from the "Next set" tap (speech is primed there).
    nextSet() {
      this.progress = P.beginSet(this.progress);
      wordEl.textContent = " ";
      wordEl.className = "";
      this.startRep();
    },

    // The set's last rep has reached its endMs: no more reps are scheduled.
    finishSet() {
      this.stopCountdown();
      countdownEl.classList.add("idle");
      speak(this.settings.training.setDoneSpoken, { rate: this.settings.baseRate, cancel: false });
      showSetComplete(this.progress, this.settings.training);
    },

    // Every timer goes through here so Stop can clear all of them.
    later(fn, delayMs) {
      const id = setTimeout(() => {
        this.timers = this.timers.filter(t => t !== id);
        fn();
