      }, Math.max(0, delayMs));
      this.timers.push(id);
    },

    say(id, rate) {
      const phrase = this.settings.phrases[id];
      const len = phrase.display.length;
      const long = len > 18 ? " long xlong" : len > 7 ? " long" : "";
      showWord(phrase.display, PHRASE_CLASS[id] + long);
      const utter = speak(phrase.spoken, { rate, cancel: false });
      if (utter) this.measure(utter, id, rate);
    },

    // Time onstart -> onend to learn this device's real spoken lengths. Missing
    // events, errors and anything cut short by Stop are simply ignored.
    measure(utter, id, rate) {
      const runId = this.runId;
      const settings = this.settings;
      let startedAt = null;
      utter.onstart = () => { startedAt = performance.now(); };
      utter.onerror = () => { startedAt = null; };
      utter.onend = () => {
        if (startedAt === null || runId !== this.runId) return;
        recordSpokenLength(id, performance.now() - startedAt, rate, settings);
      };
    },

    // Plan one rep and schedule all of it from a single clock origin.
    startRep() {
      const s = this.settings;
      this.progress = P.beginRep(this.progress);
      sessionProgress.textContent = P.progressLabel(this.progress, s.training);
      const plan = this.profile.planRep(s, s.durations, Math.random);

      // Rep clock: t = 0 is when the first call should be heard. Every call is
      // spoken speechLeadMs before its planned time to cover TTS start-up, so the
      // first call goes out right now. Each timer is computed from this origin,
      // never chained from the previous one, so drift does not accumulate.
      const origin = performance.now() + s.speechLeadMs;
      const at = ms => origin + ms - s.speechLeadMs - performance.now();

      countdownEl.classList.add("idle");
      plan.calls.forEach(call => {
        const delay = at(call.atMs);
        if (delay <= 0) this.say(call.id, call.rate);
        else this.later(() => this.say(call.id, call.rate), delay);
      });

      // The countdown bar is drawn only from plan.windows.
      plan.windows.forEach(w => {
        this.later(() => this.runCountdown(origin + w.startMs, w.durMs), at(w.startMs));
      });

      // The last rep of a set ends the set at its endMs, without waiting for its rest.
      if (P.isSetComplete(this.progress, s.training)) {
        this.later(() => this.finishSet(), origin + plan.endMs - performance.now());
      } else {
        this.later(() => this.startRep(), origin + plan.endMs + plan.restMs - performance.now());
      }
    },

    // Drain the bar from durMs to 0 starting at windowStart; it then sits empty at 0.0 s.
    runCountdown(windowStart, durMs) {
      this.stopCountdown();
      countdownEl.classList.remove("idle");
      const tick = () => {
        const remaining = Math.min(durMs, Math.max(0, windowStart + durMs - performance.now()));
        renderCountdown(remaining, durMs);
        this.rafId = remaining > 0 ? requestAnimationFrame(tick) : null;
      };
      tick();
    },

    stopCountdown() {
      if (this.rafId !== null) {
        cancelAnimationFrame(this.rafId);
        this.rafId = null;
      }
    },

    stop() {
      this.runId++;
      this.timers.forEach(clearTimeout);
      this.timers = [];
      this.stopCountdown();
      if (this.clockId !== null) {
        clearInterval(this.clockId);
        this.clockId = null;
      }
      countdownEl.classList.add("hidden", "idle");
      sessionBanner.classList.add("hidden");
    },
  };

  // ---- Offense settings form ----

  // Settings are addressed by dotted paths into OFFENSE_DEFAULTS, e.g. "shooters.windowMinMs".
  function getPath(obj, path) {
    return path.split(".").reduce((o, key) => (o == null ? undefined : o[key]), obj);
  }

  function setPath(obj, path, value) {
    const keys = path.split(".");
    const last = keys.pop();
    keys.reduce((o, key) => o[key], obj)[last] = value;
  }

  function makeNumberField(inputId, labelText, attrs) {
    const field = document.createElement("div");
    field.className = "field";
    const label = document.createElement("label");
    label.htmlFor = inputId;
    label.textContent = labelText;
    const input = document.createElement("input");
    input.type = "number";
    input.id = inputId;
    input.min = attrs.min;
    input.step = attrs.step;
    Object.assign(input.dataset, attrs.data);
    field.append(label, input);
    return field;
  }

  function makeSection(titleText, fields) {
    const section = document.createElement("div");
    const title = document.createElement("p");
    title.className = "weight-title";
    title.textContent = titleText;
    const grid = document.createElement("div");
    grid.className = "field-grid";
    fields.forEach(f => grid.appendChild(f));
    section.append(title, grid);
    return section;
  }

  // Weight inputs for one drill. prefix is "" for Drive (so its input ids and
  // saved keys stay as before) and "shooters." for Shooters.
  function buildWeightTables(container, tables, prefix, titles) {
    tables.forEach(table => {
      const tablePath = prefix + table;
      const fields = Object.keys(getPath(OFFENSE_DEFAULTS, tablePath)).map(id => {
        const inputId = "w-" + tablePath.replace(/\./g, "-") + "-" + id;
        const labelText = prefix && SHORT_LABELS[id] ? SHORT_LABELS[id] : OFFENSE_DEFAULTS.phrases[id].display;
        return makeNumberField(inputId, labelText, {
          min: "0", step: "1", data: { weightTable: tablePath, weightId: id },
        });
      });
      container.appendChild(makeSection(titles[table], fields));
    });
  }

  // Get-set min/max inputs, one pair per start call.
  function buildGetSetFields() {
    const fields = [];
    P.START_CALLS.forEach(id => {
      ["min", "max"].forEach(end => {
        fields.push(makeNumberField("sh-getSet-" + id + "-" + end, SHORT_LABELS[id] + " " + end + " (ms)", {
          min: "0", step: "100", data: { setting: "shooters.getSetMs." + id + "." + end + "Ms" },
        }));
      });
    });
    getSetFieldsEl.appendChild(makeSection("Get-set time after the start call", fields));
  }

  function parseNumber(value) {
    return String(value).trim() === "" ? NaN : Number(value);
  }

  function settingInputs() {
    return offensePanel.querySelectorAll("input[data-setting]");
  }

  function weightInputs() {
    return offensePanel.querySelectorAll("input[data-weight-table]");
  }

  // Session inputs: data-training keys into TRAINING_DEFAULTS.
  function trainingInputs() {
    return offensePanel.querySelectorAll("input[data-training]");
  }

  function fillOffenseDefaults() {
    settingInputs().forEach(input => { input.value = getPath(OFFENSE_DEFAULTS, input.dataset.setting); });
    weightInputs().forEach(input => {
      input.value = getPath(OFFENSE_DEFAULTS, input.dataset.weightTable)[input.dataset.weightId];
    });
    trainingInputs().forEach(input => { input.value = P.TRAINING_DEFAULTS[input.dataset.training]; });
  }

  function readTrainingSettings() {
    const t = Object.assign({}, P.TRAINING_DEFAULTS);
    trainingInputs().forEach(input => { t[input.dataset.training] = parseNumber(input.value); });
    return t;
  }

  // − / + buttons: step the input by its step, clamped to its min/max, then
  // fire "input" so the change is saved like typing.
  function wireSteppers() {
    offensePanel.querySelectorAll(".stepper").forEach(stepper => {
      const input = stepper.querySelector("input");
      stepper.querySelectorAll("button[data-step]").forEach(btn => btn.addEventListener("click", () => {
        const step = Number(input.step) || 1;
        const min = input.min === "" ? -Infinity : Number(input.min);
        const max = input.max === "" ? Infinity : Number(input.max);
        const current = parseNumber(input.value);
        const base = isNaN(current) ? P.TRAINING_DEFAULTS[input.dataset.training] : current;
        input.value = Math.min(max, Math.max(min, base + Number(btn.dataset.step) * step));
        input.dispatchEvent(new Event("input"));
      }));
    });
  }

  // range is the shared Min/Max read time (Drive only; null for Shooters).
  function readOffenseSettings(range) {
    const s = P.cloneSettings(OFFENSE_DEFAULTS);
    settingInputs().forEach(input => { setPath(s, input.dataset.setting, parseNumber(input.value)); });
    weightInputs().forEach(input => {
      getPath(s, input.dataset.weightTable)[input.dataset.weightId] = parseNumber(input.value);
    });
    if (range) {
      s.readMinMs = range.min;
      s.readMaxMs = range.max;
    }
    s.drill = selectedDrill;
    s.training = readTrainingSettings();
    return s;
  }

  // ---- Persistence: mode, drill, shared Min/Max fields and offense settings only ----
  // Values are saved by input id, so settings saved before a field existed
  // simply keep that field's default.

  function persistedInputs() {
    return [minMsInput, maxMsInput].concat(
      Array.from(settingInputs()), Array.from(weightInputs()), Array.from(trainingInputs()));
  }

  function saveSettings() {
    const values = {};
    persistedInputs().forEach(input => { values[input.id] = input.value; });
    storageSet(STORAGE_SETTINGS, JSON.stringify(values));
  }

  function loadSettings() {
    let values = null;
    try {
      values = JSON.parse(storageGet(STORAGE_SETTINGS));
    } catch (e) {}
    if (!values || typeof values !== "object") return;
    persistedInputs().forEach(input => {
      if (typeof values[input.id] === "string") input.value = values[input.id];
    });
  }

  // ---- Modes ----

  const MODES = {
    defense: {
      mode: defenseMode,
      label: "DEFENSE",
      subtitle: "A voice randomly calls Left, Right, Up, or Back. React fast.",
      minLabel: "Min delay (ms)",
      maxLabel: "Max delay (ms)",
    },
    offense: {
      mode: offenseMode,
      // Label and subtitle come from DRILLS.
      minLabel: "Min read time (ms)",
      maxLabel: "Max read time (ms)",
    },
  };

  function has(obj, key) {
    return typeof key === "string" && Object.prototype.hasOwnProperty.call(obj, key);
  }

  function clearErrors() {
    rangeError.textContent = "";
    Object.keys(ERROR_TARGETS).forEach(key => { ERROR_TARGETS[key].el.textContent = ""; });
  }

  function showError(error) {
    const target = ERROR_TARGETS[error.field];
    if (target.details) target.details.open = true;
    target.el.textContent = error.message;
  }

  // Show the panels, labels and subtitle for the selected mode and drill.
  function updateView() {
    const offense = selectedMode === "offense";
    const shooters = selectedDrill === "shooters";
    const info = MODES[selectedMode];
    modeButtons.forEach(btn => btn.setAttribute("aria-pressed", String(btn.dataset.mode === selectedMode)));
    drillButtons.forEach(btn => btn.setAttribute("aria-pressed", String(btn.dataset.drill === selectedDrill)));
    subtitleEl.textContent = offense ? DRILLS[selectedDrill].subtitle : info.subtitle;
    minMsLabel.textContent = info.minLabel;
    maxMsLabel.textContent = info.maxLabel;
    offensePanel.classList.toggle("hidden", !offense);
    // The read time only applies to Drive.
    rangePanel.classList.toggle("hidden", offense && shooters);
    driveSettings.classList.toggle("hidden", shooters);
    shootersSettings.classList.toggle("hidden", !shooters);
    clearErrors();
  }

  function selectMode(name) {
    selectedMode = has(MODES, name) ? name : "defense";
    updateView();
  }

  function selectDrill(name) {
    selectedDrill = has(DRILLS, name) ? name : "drive";
    updateView();
  }

  function startGame() {
    clearErrors();
    const usesRange = selectedMode === "defense" || selectedDrill === "drive";
    const range = usesRange ? validateRange() : null;
    if (usesRange && !range) return;

    let settings = range;
    if (selectedMode === "offense") {
      settings = readOffenseSettings(range);
      // Spoken lengths are fixed for the whole run (the ones validated here);
      // anything learned during the run takes effect on the next Start.
      settings.durations = P.durationsFor(settings, learnedMs);
      const error = P.PROFILES[settings.drill].validate(settings, settings.durations) ||
        P.validateSession(settings.training);
      if (error) {
        showError(error);
        return;
      }
    }

    primeSpeech();

    const offense = selectedMode === "offense";
    startScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
    modeLabel.textContent = offense ? DRILLS[selectedDrill].label : MODES[selectedMode].label;
    setScreenLabel.textContent = modeLabel.textContent;
    sessionClock.classList.toggle("hidden", !offense);
    sessionProgress.classList.toggle("hidden", !offense);
    sessionBanner.classList.add("hidden");
    wordEl.textContent = " ";
    wordEl.className = "";

    activeMode = MODES[selectedMode].mode;
    activeMode.start(settings);
  }

  function stopGame() {
    if (activeMode) {
      activeMode.stop();
      activeMode = null;
    }
    if (window.speechSynthesis) window.speechSynthesis.cancel();

    gameScreen.classList.add("hidden");
    setScreen.classList.add("hidden");
    startScreen.classList.remove("hidden");
  }

  // Offense: the set's last rep has ended. Placeholder until the set log form exists.
  function showSetComplete(progress, t) {
    setDoneText.textContent = "Set " + progress.set + " of " + t.plannedSets + " done." +
      (progress.set >= t.plannedSets ? " That's every planned set. End the session, or keep going." : "");
    gameScreen.classList.add("hidden");
    setScreen.classList.remove("hidden");
  }

  // A fresh tap, so speech is primed again before the set's first call.
  function startNextSet() {
    if (activeMode !== offenseMode) return;
    primeSpeech();
    setScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
    offenseMode.nextSet();
  }

  buildWeightTables(weightTablesEl, P.WEIGHT_TABLES, "", WEIGHT_TABLE_TITLES);
  buildGetSetFields();
  buildWeightTables(shootersWeightTablesEl, P.SHOOTERS_WEIGHT_TABLES, "shooters.", SHOOTERS_WEIGHT_TABLE_TITLES);
  fillOffenseDefaults();
  loadSettings();
  persistedInputs().forEach(input => input.addEventListener("input", saveSettings));
  wireSteppers();

  modeButtons.forEach(btn => btn.addEventListener("click", () => {
    selectMode(btn.dataset.mode);
    storageSet(STORAGE_MODE, selectedMode);
  }));
  drillButtons.forEach(btn => btn.addEventListener("click", () => {
    selectDrill(btn.dataset.drill);
    storageSet(STORAGE_DRILL, selectedDrill);
  }));
  const savedDrill = storageGet(STORAGE_DRILL);
  selectedDrill = has(DRILLS, savedDrill) ? savedDrill : "drive";
  selectMode(storageGet(STORAGE_MODE));

  startBtn.addEventListener("click", startGame);
  stopBtn.addEventListener("click", stopGame);
  nextSetBtn.addEventListener("click", startNextSet);
  endSessionBtn.addEventListener("click", stopGame);
})();
</script>
<script>
// ?selftest=1: run the offense planner simulation and show the results.
(function () {
  if (new URLSearchParams(window.location.search).get("selftest") !== "1") return;

  document.getElementById("app").classList.add("hidden");
  const banner = document.createElement("pre");
  banner.style.cssText = "margin:0;padding:16px;white-space:pre-wrap;font-size:13px;line-height:1.5;";
  document.body.appendChild(banner);

  const lines = [];
  const log = line => {
    console.log(line);
    lines.push(line);
  };

  log("Reaction Caller offense self-test (Drive and Shooters)\n");
  const result = OffensePlanner.runSelfTest(log, 10000);
  console.table(result.fitTables.drive);
  console.table(result.fitTables.shooters);

  const s = OffensePlanner.OFFENSE_DEFAULTS;
  lines.push("\nDrive fit table: minimum drive window at maxRate " + s.maxRate + ", minGap " + s.minGapMs +
    " ms, buffer " + s.finisherBufferMs + " ms (driveMaxMs " + s.driveMaxMs + ")");
  result.fitTables.drive.forEach(r => {
    lines.push(r.cutOffs + " cut-offs  " + (r.finisher + "                  ").slice(0, 19) +
      String(r.minWindowMs).padStart(5) + " ms  fits: " + r.fitsAtDriveMax);
  });

  const sh = s.shooters;
  lines.push("\nShooters fit table: minimum window at maxRate " + s.maxRate + ", minGap " + s.minGapMs +
    " ms, shot buffer " + sh.shotBufferMs + " ms (windowMaxMs " + sh.windowMaxMs + ")");
  result.fitTables.shooters.forEach(r => {
    lines.push(r.cutOffs + " cut-offs  " + r.sequence.padEnd(33) +
      String(r.minWindowMs).padStart(5) + " ms  fits: " + r.fitsAtWindowMax);
  });

  banner.style.color = result.passed ? "#4fd87c" : "#ff4f5e";
  banner.textContent = lines.join("\n");
})();
</script>
</body>
</html>
