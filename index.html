      sets: sets.length, reps: 0, loggedSets: 0,
      made: 0, attempted: 0, lostHandles: 0, missedCalls: 0,
      makePct: null, errorsPerRep: null, lostPer10: null, missedPer10: null,
      ratedSets: 0, cleanSets: 0, cleanShare: null,
    };
    let errorReps = 0;
    sets.forEach(set => {
      sum.reps += set.reps;
      if (set.made !== null && set.attempted !== null) {
        sum.loggedSets++;
        sum.made += set.made;
        sum.attempted += set.attempted;
      }
      if (set.lostHandles !== null && set.missedCalls !== null) {
        sum.lostHandles += set.lostHandles;
        sum.missedCalls += set.missedCalls;
        errorReps += set.reps;
      }
      if (set.quality !== null) {
        sum.ratedSets++;
        if (set.quality === "clean") sum.cleanSets++;
      }
    });
    if (sum.attempted > 0) sum.makePct = sum.made / sum.attempted;
    if (errorReps > 0) {
      sum.errorsPerRep = (sum.lostHandles + sum.missedCalls) / errorReps;
      sum.lostPer10 = sum.lostHandles / errorReps * 10;
      sum.missedPer10 = sum.missedCalls / errorReps * 10;
    }
    if (sum.ratedSets > 0) sum.cleanShare = sum.cleanSets / sum.ratedSets;
    return sum;
  }

  function setsOfDrill(session, drill) {
    return session && Array.isArray(session.sets) ? session.sets.filter(set => set && set.drill === drill) : [];
  }

  // Drills in a session, in the order they were first played.
  function sessionDrills(session) {
    const drills = [];
    (session && Array.isArray(session.sets) ? session.sets : []).forEach(set => {
      if (set && drills.indexOf(set.drill) === -1) drills.push(set.drill);
    });
    return drills;
  }

  // [{ drill, summary }] per drill played in the session.
  function summarizeByDrill(session) {
    return sessionDrills(session).map(drill => ({ drill, summary: summarizeSets(setsOfDrill(session, drill)) }));
  }

  // Session length in ms from startedAt to endedAt, or null.
  function sessionLengthMs(session) {
    const a = Date.parse(session.startedAt);
    const b = Date.parse(session.endedAt);
    return isFinite(a) && isFinite(b) && b >= a ? b - a : null;
  }

  function byStart(a, b) {
    return a.startedAt < b.startedAt ? -1 : a.startedAt > b.startedAt ? 1 : 0;
  }

  // Sessions with sets of this drill, oldest first.
  function sessionsWithDrill(log, drill) {
    return log.sessions.filter(s => isPlainObject(s) && typeof s.startedAt === "string" && setsOfDrill(s, drill).length > 0)
      .sort(byStart);
  }

  function mean(values) {
    const v = values.filter(x => x !== null);
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
  }

  // Today's make % and lost handles per 10 reps for one drill, against the mean
  // of the previous n sessions (started earlier) that played the same drill.
  function compareWithPrevious(log, session, drill, n) {
    const today = summarizeSets(setsOfDrill(session, drill));
    const prev = sessionsWithDrill(log, drill)
      .filter(s => s.id !== session.id && s.startedAt < session.startedAt)
      .slice(-n)
      .map(s => summarizeSets(setsOfDrill(s, drill)));
    return {
      drill,
      count: prev.length,
      today: { makePct: today.makePct, lostPer10: today.lostPer10 },
      avg: { makePct: mean(prev.map(p => p.makePct)), lostPer10: mean(prev.map(p => p.lostPer10)) },
    };
  }

  // "Make % 62 (avg 55). Lost handles 1.2 per 10 reps (avg 2.0)"
  function comparisonText(cmp) {
    const pct = x => String(Math.round(x * 100));
    const parts = [];
    if (cmp.today.makePct !== null) {
      parts.push("Make % " + pct(cmp.today.makePct) + (cmp.avg.makePct !== null ? " (avg " + pct(cmp.avg.makePct) + ")" : ""));
    }
    if (cmp.today.lostPer10 !== null) {
      parts.push("Lost handles " + cmp.today.lostPer10.toFixed(1) + " per 10 reps" +
        (cmp.avg.lostPer10 !== null ? " (avg " + cmp.avg.lostPer10.toFixed(1) + ")" : ""));
    }
    if (parts.length === 0) return "Nothing logged to compare.";
    if (cmp.count === 0) parts.push("No earlier sessions to compare with yet");
    return parts.join(". ");
  }

  // The last n sessions of a drill, oldest first: [{ id, startedAt, makePct, lostPer10 }].
  function trendSeries(log, drill, n) {
    return sessionsWithDrill(log, drill).slice(-n).map(s => {
      const sum = summarizeSets(setsOfDrill(s, drill));
      return { id: s.id, startedAt: s.startedAt, makePct: sum.makePct, lostPer10: sum.lostPer10 };
    });
  }

  // Chart geometry for a trend in box { width, height, left, right, top, bottom }
  // (the last four are padding). Make % runs 0..1 on the left axis, lost handles
  // per 10 reps 0..lostMax on the right; points with no value are left out.
  function trendGeometry(series, box) {
    const plotW = box.width - box.left - box.right;
    const plotH = box.height - box.top - box.bottom;
    const n = series.length;
    const x = i => box.left + (n <= 1 ? plotW / 2 : i * plotW / (n - 1));
    const maxLost = Math.max(0, ...series.map(p => (p.lostPer10 === null ? 0 : p.lostPer10)));
    const lostMax = Math.max(2, Math.ceil(maxLost));
    const make = [];
    const lost = [];
    series.forEach((p, i) => {
      if (p.makePct !== null) make.push({ x: x(i), y: box.top + plotH * (1 - p.makePct), value: p.makePct });
      if (p.lostPer10 !== null) lost.push({ x: x(i), y: box.top + plotH * (1 - p.lostPer10 / lostMax), value: p.lostPer10 });
    });
    return { make, lost, lostMax, plot: { x0: box.left, x1: box.left + plotW, y0: box.top, y1: box.top + plotH } };
  }

  // A new log without the session with this id.
  function deleteSession(log, id) {
    const next = clone(log);
    next.sessions = next.sessions.filter(s => !(s && s.id === id));
    return next;
  }

  // A stored session is importable if it has an id, a start time and only valid sets.
  function isValidSession(s) {
    return isPlainObject(s) && typeof s.id === "string" && s.id !== "" && typeof s.startedAt === "string" &&
      (s.endedAt === null || typeof s.endedAt === "string") && Array.isArray(s.sets) &&
      s.sets.every(set => validateSet(set) === null);
  }

  // Read an exported backup. Returns { log, skipped } (invalid sessions are
  // skipped) or { error } for text that isn't a version 1 log.
  function parseImport(text) {
    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      return { error: "This isn't a backup file (it isn't valid JSON)." };
    }
    if (!isPlainObject(data) || !Array.isArray(data.sessions)) return { error: "This file isn't a Reaction Caller log." };
    if (data.version !== LOG_VERSION) {
      return {
        error: typeof data.version === "number" && data.version > LOG_VERSION
          ? "This backup is from a newer version of the app (log version " + data.version + "). Update the app first."
          : "This file has an unknown log version.",
      };
    }
    const sessions = data.sessions.filter(isValidSession);
    return { log: { version: LOG_VERSION, sessions: clone(sessions) }, skipped: data.sessions.length - sessions.length };
  }

  // Merge incoming sessions into a log by session id. New ids are added, exact
  // copies are skipped, and sessions that differ are only replaced when
  // replaceConflicts is true. Never duplicates an id. Inputs are not changed.
  // Returns { log, added, identical, conflicts } (arrays of ids).
  function mergeLogs(current, incoming, replaceConflicts) {
    const log = clone(current);
    const out = { log, added: [], identical: [], conflicts: [] };
    incoming.sessions.forEach(s => {
      const i = log.sessions.findIndex(x => x && x.id === s.id);
      if (i === -1) {
        log.sessions.push(clone(s));
        out.added.push(s.id);
      } else if (JSON.stringify(log.sessions[i]) === JSON.stringify(s)) {
        if (out.added.indexOf(s.id) === -1) out.identical.push(s.id);
      } else {
        out.conflicts.push(s.id);
        if (replaceConflicts) log.sessions[i] = clone(s);
      }
    });
    log.sessions.sort(byStart);
    return out;
  }

  const CSV_COLUMNS = [
    "session_id", "session_started", "set", "drill", "level", "reps", "set_started", "set_ended",
    "made", "attempted", "lost_handles", "missed_calls", "quality", "note",
  ];

  // One CSV field: empty for null, quoted (with "" for ") when it holds a comma,
  // quote, line break or leading/trailing space.
  function csvField(v) {
    if (v === null || v === undefined) return "";
    const s = String(v);
    return /[",\r\n]|^\s|\s$/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  // Every set as one CSV row (RFC 4180 style, CRLF line ends), oldest session first.
  function setsToCsv(log) {
    const rows = [CSV_COLUMNS.join(",")];
    log.sessions.slice().sort(byStart).forEach(s => {
      s.sets.forEach((set, i) => {
        rows.push([
          s.id, s.startedAt, i + 1, set.drill, set.level, set.reps, set.startedAt, set.endedAt,
          set.made, set.attempted, set.lostHandles, set.missedCalls, set.quality, set.note,
        ].map(csvField).join(","));
      });
    });
    return rows.join("\r\n") + "\r\n";
  }

  // "reaction-caller-log-2026-10-08.json" for a Date (local calendar day).
  function exportFileName(date, base, ext) {
    const two = n => String(n).padStart(2, "0");
    return base + "-" + date.getFullYear() + "-" + two(date.getMonth() + 1) + "-" + two(date.getDate()) + "." + ext;
  }

  // Sessions changed (ended, or started if never ended) after the last export.
  function unexportedCount(log, lastExportAt) {
    return log.sessions.filter(s => isPlainObject(s) &&
      (lastExportAt === null || (s.endedAt || s.startedAt || "") > lastExportAt)).length;
  }

  // Read stored text. Never throws. Returns { status, log, keepRaw }:
  //   "empty"  nothing stored: a new log;
  //   "ok"     a version 1 log;
  //   "newer"  a version this code doesn't know yet;
  //   "corrupt" not JSON, or not a log at all.
  // For "newer" and "corrupt", log is a new empty log and keepRaw is the stored
  // text, which must be backed up before anything is written to the log key.
  function parseLog(raw) {
    if (raw === null || raw === undefined || raw === "") return { status: "empty", log: emptyLog(), keepRaw: null };
    let parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      return { status: "corrupt", log: emptyLog(), keepRaw: raw };
    }
    if (isPlainObject(parsed) && parsed.version === LOG_VERSION && Array.isArray(parsed.sessions)) {
      return { status: "ok", log: parsed, keepRaw: null };
    }
    const newer = isPlainObject(parsed) && typeof parsed.version === "number" && parsed.version > LOG_VERSION;
    return { status: newer ? "newer" : "corrupt", log: emptyLog(), keepRaw: raw };
  }

  // Load the log from a store. The returned state is passed to saveLog.
  function openLog(store) {
    const parsed = parseLog(store.get(LOG_KEY));
    return { status: parsed.status, log: parsed.log, keepRaw: parsed.keepRaw, backupKey: null };
  }

  // Write state.log to the store. If the stored text could not be read as a
  // version 1 log, it is first copied to reactionCaller.log.backup.<nowMs> and
  // read back; if that copy fails, nothing is written, so it is never lost.
  // Returns { state, saved }.
  function saveLog(state, store, nowMs) {
    const next = Object.assign({}, state);
    if (next.keepRaw !== null) {
      let key = BACKUP_PREFIX + nowMs;
      for (let i = 1; store.get(key) !== null && store.get(key) !== next.keepRaw; i++) key = BACKUP_PREFIX + nowMs + "-" + i;
      store.set(key, next.keepRaw);
      if (store.get(key) !== next.keepRaw) return { state, saved: false };
      next.keepRaw = null;
      next.backupKey = key;
    }
    const text = JSON.stringify(next.log);
    store.set(LOG_KEY, text);
    return { state: next, saved: store.get(LOG_KEY) === text };
  }

  // ---- Self-test (only called from ?selftest=1) ----

  function selfTest(check) {
    const P = OffensePlanner;
    const base = {
      drill: "drive", level: null, reps: 8, startedAt: "2026-01-01T10:00:00.000Z", endedAt: "2026-01-01T10:01:00.000Z",
      made: 5, attempted: 8, lostHandles: 1, missedCalls: 0, quality: "clean", note: null,
      settingsSnapshot: { driveMinMs: 1400 }, extra: {},
    };
    const withSet = changes => Object.assign({}, base, changes);
    const skipped = withSet({ made: null, attempted: null, lostHandles: null, missedCalls: null, quality: null, note: null });

    const ok = [];
    [["full", base], ["skipped", skipped], ["note", withSet({ note: "felt slow" })],
     ["made = attempted", withSet({ made: 8 })], ["0 of 0", withSet({ made: 0, attempted: 0 })],
     ["off-balance", withSet({ quality: "off_balance" })], ["shooters", withSet({ drill: "shooters" })]].forEach(c => {
      const e = validateSet(c[1]);
      if (e) ok.push(c[0] + ": " + e.message);
    });
    check("log: valid sets (full, skipped, edge values) pass validation", ok);

    const rejects = [];
    [["made > attempted", { made: 9 }], ["negative made", { made: -1 }], ["fractional attempted", { attempted: 7.5 }],
     ["NaN lost handles", { lostHandles: NaN }], ["negative missed calls", { missedCalls: -2 }],
     ["string count", { made: "5" }], ["made without attempted", { attempted: null }],
     ["unknown quality", { quality: "great" }], ["quality wrong case", { quality: "Clean" }],
     ["unknown drill", { drill: "mixed" }], ["0 reps", { reps: 0 }], ["note too long", { note: "x".repeat(501) }],
     ["extra not object", { extra: null }], ["no snapshot", { settingsSnapshot: undefined }],
     ["no end time", { endedAt: undefined }]].forEach(c => {
      if (!validateSet(withSet(c[1]))) rejects.push("accepted " + c[0]);
    });
    check("log: validation rejects made > attempted, bad counts, unknown quality and bad fields", rejects);

    const near = (a, b) => a !== null && b !== null && Math.abs(a - b) < 1e-9;
    const math = [];
    if (!near(setSuccess(base), 5 / 8)) math.push("setSuccess 5/8");
    if (setSuccess(skipped) !== null) math.push("setSuccess skipped");
    if (setSuccess(withSet({ made: 0, attempted: 0 })) !== null) math.push("setSuccess 0/0");
    if (!near(setErrorRate(withSet({ lostHandles: 2, missedCalls: 1, reps: 6 })), 0.5)) math.push("setErrorRate 3/6");
    if (setErrorRate(skipped) !== null) math.push("setErrorRate skipped");

    const session = {
      id: "s1", startedAt: base.startedAt, endedAt: base.endedAt,
      sets: [
        withSet({ made: 5, attempted: 8, lostHandles: 1, missedCalls: 1, quality: "clean" }),
        withSet({ made: 3, attempted: 8, lostHandles: 0, missedCalls: 2, quality: "rushed" }),
        withSet({ reps: 8, made: null, attempted: null, lostHandles: null, missedCalls: null, quality: null }),
        withSet({ reps: 4, made: 2, attempted: 4, lostHandles: 0, missedCalls: 0, quality: "clean" }),
      ],
    };
    const sum = summarizeSession(session);
    const want = { sets: 4, reps: 28, loggedSets: 3, made: 10, attempted: 20, lostHandles: 1, missedCalls: 3,
      ratedSets: 3, cleanSets: 2 };
    Object.keys(want).forEach(k => { if (sum[k] !== want[k]) math.push("summary." + k + " = " + sum[k] + " (want " + want[k] + ")"); });
    if (!near(sum.makePct, 0.5)) math.push("makePct " + sum.makePct);
    if (!near(sum.errorsPerRep, 4 / 20)) math.push("errorsPerRep " + sum.errorsPerRep);
    if (!near(sum.cleanShare, 2 / 3)) math.push("cleanShare " + sum.cleanShare);
    const none = summarizeSession({ id: "s2", sets: [] });
    if (none.sets !== 0 || none.makePct !== null || none.errorsPerRep !== null || none.cleanShare !== null) math.push("empty session");
    check("log: setSuccess, setErrorRate and summarizeSession math", math);

    const snap = [];
    const settings = P.cloneSettings(P.OFFENSE_DEFAULTS);
    Object.assign(settings, { readMinMs: 1000, readMaxMs: 3000, training: Object.assign({}, P.TRAINING_DEFAULTS) });
    const drive = snapshotSettings(Object.assign({}, settings, { drill: "drive" }));
    ["readMinMs", "driveMinMs", "driveMaxMs", "maxCutOffsPerDrive", "afterLayUpWeights", "maxRate", "repsPerSet"].forEach(k => {
      if (drive[k] === undefined) snap.push("drive snapshot missing " + k);
    });
    if (drive.shooters !== undefined || drive.phrases !== undefined) snap.push("drive snapshot has unrelated settings");
    const shooters = snapshotSettings(Object.assign({}, settings, { drill: "shooters" }));
    if (!shooters.shooters || !shooters.shooters.getSetMs || shooters.shooters.windowMaxMs !== 1800 ||
        !shooters.shooters.afterShotWeights || shooters.driveMinMs !== undefined) {
      snap.push("shooters snapshot fields");
    }
    settings.shooters.getSetMs.CATCH.minMs = 1;
    settings.afterLayUpWeights.CUT_OFF = 1;
    if (shooters.shooters.getSetMs.CATCH.minMs === 1 || drive.afterLayUpWeights.CUT_OFF === 1) snap.push("snapshot is not a copy");
    check("log: settings snapshot holds the drill's timing, weights and caps as a copy", snap);

    const up = [];
    const log0 = emptyLog();
    const log1 = upsertSession(log0, { id: "a", sets: [base] });
    const log2 = upsertSession(log1, { id: "a", sets: [base, base] });
    const log3 = upsertSession(log2, { id: "b", sets: [] });
    if (log0.sessions.length !== 0 || log1.sessions[0].sets.length !== 1) up.push("input changed");
    if (log2.sessions.length !== 1 || log2.sessions[0].sets.length !== 2) up.push("replace by id");
    if (log3.sessions.length !== 2 || log3.version !== 1) up.push("append");
    check("log: upsertSession appends or replaces by id without changing its input", up);

    const parse = [];
    const v1 = JSON.stringify(log3);
    const r1 = parseLog(v1);
    if (r1.status !== "ok" || r1.log.sessions.length !== 2 || r1.keepRaw !== null) parse.push("v1 not ok");
    [null, ""].forEach(raw => {
      const r = parseLog(raw);
      if (r.status !== "empty" || r.log.version !== 1 || r.keepRaw !== null) parse.push("empty " + JSON.stringify(raw));
    });
    [['{"version":2,"sessions":[{"id":"x"}]}', "newer"], ['{"version":99}', "newer"], ['{"sessions":[]}', "corrupt"],
     ['{"version":"1","sessions":[]}', "corrupt"], ['{"version":1,"sessions":"x"}', "corrupt"], ["{version:1}", "corrupt"],
     ["null", "corrupt"], ["[]", "corrupt"], ["42", "corrupt"], ['"text"', "corrupt"], ["{", "corrupt"]].forEach(c => {
      let r;
      try {
        r = parseLog(c[0]);
      } catch (e) {
        parse.push(c[0] + " threw " + e.message);
        return;
      }
      if (r.status !== c[1] || r.keepRaw !== c[0] || r.log.version !== 1 || r.log.sessions.length !== 0) {
        parse.push(c[0] + " -> " + r.status);
      }
    });
    check("log: parseLog reads version 1, and never throws on newer, unknown or broken text", parse);

    // Fake stores: a Map, and one whose writes to backup keys are lost (full storage).
    const fakeStore = (initial, dropBackups) => {
      const m = new Map(Object.entries(initial));
      return {
        map: m,
        get: k => (m.has(k) ? m.get(k) : null),
        set: (k, v) => { if (!(dropBackups && k.indexOf(BACKUP_PREFIX) === 0)) m.set(k, v); },
      };
    };
    const store = [];
    const newerRaw = '{"version":2,"sessions":[{"id":"future"}]}';
    const a = fakeStore({ [LOG_KEY]: newerRaw });
    let st = openLog(a);
    if (st.status !== "newer" || a.get(LOG_KEY) !== newerRaw) store.push("open changed the stored log");
    st.log = upsertSession(st.log, { id: "s", sets: [base] });
    const res = saveLog(st, a, 1000);
    if (!res.saved || a.get(BACKUP_PREFIX + "1000") !== newerRaw) store.push("newer log not backed up");
    if (parseLog(a.get(LOG_KEY)).status !== "ok") store.push("new log not written");
    const again = saveLog(res.state, a, 2000);
    if (a.map.size !== 2 || !again.saved) store.push("second save made another backup");

    const b = fakeStore({ [LOG_KEY]: "{broken" }, true);
    const rb = saveLog(openLog(b), b, 1000);
    if (rb.saved || b.get(LOG_KEY) !== "{broken") store.push("broken log overwritten although its backup failed");

    const c = fakeStore({});
    let sc = openLog(c);
    sc.log = upsertSession(sc.log, { id: "s1", sets: [base] });
    sc = saveLog(sc, c, 1).state;
    sc = openLog(c);
    sc.log = upsertSession(sc.log, { id: "s2", sets: [base] });
    saveLog(sc, c, 2);
    if (parseLog(c.get(LOG_KEY)).log.sessions.length !== 2 || c.map.size !== 1) store.push("valid log not kept across opens");
    check("log: saving backs up a newer or broken log first, and never overwrites it if the backup fails", store);

    historySelfTest(check, base, withSet, near);
  }

  // Summary, comparison, trend, merge, import and CSV checks.
  function historySelfTest(check, base, withSet, near) {
    const day = d => "2026-03-" + String(d).padStart(2, "0") + "T10:00:00.000Z";
    const drive = (made, attempted, lost, missed, reps, quality) =>
      withSet({ drill: "drive", made, attempted, lostHandles: lost, missedCalls: missed, reps, quality });
    const shoot = (made, attempted, lost, missed, reps) =>
      withSet({ drill: "shooters", made, attempted, lostHandles: lost, missedCalls: missed, reps, quality: null });

    // 1. Per-drill summary, per-10 rates and session length.
    const sum = [];
    const today = {
      id: "today", startedAt: day(20), endedAt: "2026-03-20T10:32:10.000Z",
      sets: [drive(5, 8, 1, 0, 8, "clean"), shoot(6, 10, 0, 1, 10), drive(7, 8, 0, 0, 8, "rushed")],
    };
    const byDrill = summarizeByDrill(today);
    if (byDrill.map(d => d.drill).join() !== "drive,shooters") sum.push("drill order " + byDrill.map(d => d.drill));
    const d0 = byDrill[0].summary;
    if (d0.sets !== 2 || d0.reps !== 16 || d0.made !== 12 || d0.attempted !== 16 || !near(d0.makePct, 0.75)) sum.push("drive totals");
    if (!near(d0.lostPer10, 10 / 16) || !near(d0.missedPer10, 0) || !near(d0.cleanShare, 0.5)) sum.push("drive per-10 / clean");
    const s0 = byDrill[1].summary;
    if (s0.sets !== 1 || !near(s0.makePct, 0.6) || !near(s0.missedPer10, 1) || s0.cleanShare !== null) sum.push("shooters totals");
    if (sessionLengthMs(today) !== 32 * 60000 + 10000) sum.push("length " + sessionLengthMs(today));
    if (sessionLengthMs({ startedAt: day(1), endedAt: null }) !== null) sum.push("length without end");
    check("history: per-drill totals, per-10-rep rates, clean share and session length", sum);

    // 2. Compare with the mean of the previous 5 sessions of the same drill only.
    const cmpF = [];
    const sessions = [];
    // Days 1-7: drive sessions; made 1..7 of 10, lost handles 1..7 in 10 reps.
    for (let d = 1; d <= 7; d++) sessions.push({ id: "d" + d, startedAt: day(d), endedAt: day(d), sets: [drive(d, 10, d, 0, 10, null)] });
    sessions.push({ id: "sh", startedAt: day(8), endedAt: day(8), sets: [shoot(0, 10, 9, 9, 10)] });
    sessions.push({ id: "later", startedAt: day(25), endedAt: day(25), sets: [drive(0, 10, 9, 9, 10, null)] });
    const now = { id: "now", startedAt: day(20), endedAt: day(20), sets: [drive(62, 100, 12, 0, 100, null)] };
    const log = { version: 1, sessions: sessions.concat(now) };
    const cmp = compareWithPrevious(log, now, "drive", 5);
    // Previous 5 drive sessions: days 3-7, make 0.3..0.7 (avg 0.5), lost 3..7 per 10 (avg 5.0).
    if (cmp.count !== 5 || !near(cmp.avg.makePct, 0.5) || !near(cmp.avg.lostPer10, 5)) {
      cmpF.push("avg " + cmp.count + " " + cmp.avg.makePct + " " + cmp.avg.lostPer10);
    }
    const text = comparisonText(cmp);
    if (text !== "Make % 62 (avg 50). Lost handles 1.2 per 10 reps (avg 5.0)") cmpF.push("text: " + text);
    // Shooters wasn't played today: only the one earlier shooters session counts, today is empty.
    const other = compareWithPrevious(log, now, "shooters", 5);
    if (other.count !== 1 || other.today.makePct !== null || !near(other.avg.makePct, 0)) cmpF.push("shooters not played today");
    if (comparisonText(other) !== "Nothing logged to compare.") cmpF.push("empty today text");
    const alone = compareWithPrevious({ version: 1, sessions: [now] }, now, "drive", 5);
    if (alone.count !== 0 || comparisonText(alone) !== "Make % 62. Lost handles 1.2 per 10 reps. No earlier sessions to compare with yet") {
      cmpF.push("no history: " + comparisonText(alone));
    }
    const fewer = compareWithPrevious(log, { id: "x", startedAt: day(3), sets: [drive(1, 2, 0, 0, 2, null)] }, "drive", 5);
    if (fewer.count !== 2 || !near(fewer.avg.makePct, 0.15)) cmpF.push("fewer than 5 earlier sessions");
    check("history: today vs the mean of the previous 5 sessions of the same drill, and its text", cmpF);

    // 3. Trend series and chart geometry.
    const tr = [];
    const many = { version: 1, sessions: [] };
    for (let d = 1; d <= 25; d++) many.sessions.push({ id: "t" + d, startedAt: "2026-04-01T" + String(d % 24).padStart(2, "0") + ":" + String(d).padStart(2, "0") + ":00.000Z", sets: [drive(d % 10, 10, d % 4, 0, 10, null)] });
    const series = trendSeries(many, "drive", 20);
    if (series.length !== 20) tr.push("series length " + series.length);
    if (series.some((p, i) => i > 0 && series[i - 1].startedAt > p.startedAt)) tr.push("series not oldest first");
    if (trendSeries(many, "shooters", 20).length !== 0) tr.push("other drill counted");
    const box = { width: 320, height: 180, left: 40, right: 40, top: 10, bottom: 30 };
    const g = trendGeometry([
      { makePct: 1, lostPer10: 0 }, { makePct: null, lostPer10: 3.2 }, { makePct: 0, lostPer10: null },
    ], box);
    if (g.make.length !== 2 || g.lost.length !== 2) tr.push("null points not skipped");
    if (g.make[0].x !== 40 || g.make[1].x !== 280 || g.lost[1].x !== 160) tr.push("x positions");
    if (g.make[0].y !== 10 || g.make[1].y !== 150) tr.push("make % y (100% top, 0% bottom)");
    if (g.lostMax !== 4 || !near(g.lost[1].y, 10 + 140 * (1 - 3.2 / 4)) || g.lost[0].y !== 150) tr.push("lost handles axis");
    const single = trendGeometry([{ makePct: 0.5, lostPer10: 0.5 }], box);
    if (single.make[0].x !== 160 || single.lostMax !== 2) tr.push("single point");
    check("history: trend series (last 20, oldest first) and chart geometry", tr);

    // 4. Merge without duplicates.
    const mf = [];
    const s1 = { id: "a", startedAt: day(1), endedAt: day(1), sets: [base] };
    const s2 = { id: "b", startedAt: day(2), endedAt: day(2), sets: [base] };
    const s2b = { id: "b", startedAt: day(2), endedAt: day(3), sets: [base, base] };
    const s3 = { id: "c", startedAt: day(0), endedAt: day(0), sets: [base] };
    const mine = { version: 1, sessions: [s1, s2] };
    const theirs = { version: 1, sessions: [s2b, s3, s1, s3] };
    const before = JSON.stringify(mine);
    const keep = mergeLogs(mine, theirs, false);
    if (JSON.stringify(mine) !== before) mf.push("current log changed");
    if (keep.log.sessions.map(s => s.id).join() !== "c,a,b") mf.push("ids " + keep.log.sessions.map(s => s.id));
    if (keep.added.join() !== "c" || keep.identical.join() !== "a" || keep.conflicts.join() !== "b") mf.push("counts");
    if (keep.log.sessions[2].sets.length !== 1) mf.push("conflict replaced without asking");
    const repl = mergeLogs(mine, theirs, true);
    if (repl.log.sessions.find(s => s.id === "b").sets.length !== 2 || repl.log.sessions.length !== 3) mf.push("replace");
    const twice = mergeLogs(keep.log, theirs, false);
    if (twice.log.sessions.length !== 3 || twice.added.length !== 0) mf.push("second merge added sessions");
    const ids = repl.log.sessions.map(s => s.id);
    if (new Set(ids).size !== ids.length) mf.push("duplicate ids");
    check("history: merge by session id adds new, skips copies, asks before replacing, never duplicates", mf);

    // 5. Import parsing and delete.
    const imp = [];
    const exported = JSON.stringify(mine);
    const ok = parseImport(exported);
    if (!ok.log || ok.log.sessions.length !== 2 || ok.skipped !== 0) imp.push("export not importable");
    const withBad = JSON.stringify({ version: 1, sessions: [s1, { id: "", sets: [] }, { id: "z", startedAt: day(1), sets: [withSet({ made: 9 })] }] });
    const partly = parseImport(withBad);
    if (!partly.log || partly.log.sessions.length !== 1 || partly.skipped !== 2) imp.push("invalid sessions not skipped");
    ["{", "[]", '{"sessions":[]}', '{"version":2,"sessions":[]}', '{"version":"1","sessions":[]}'].forEach(t => {
      const r = parseImport(t);
      if (!r.error || r.log) imp.push("accepted " + t);
    });
    if (parseImport('{"version":3,"sessions":[]}').error.indexOf("newer version") === -1) imp.push("newer version message");
    const del = deleteSession(mine, "a");
    if (del.sessions.length !== 1 || del.sessions[0].id !== "b" || mine.sessions.length !== 2) imp.push("delete");
    check("history: import accepts an export, rejects other files, skips invalid sessions; delete one session", imp);

    // 6. CSV of sets.
    const csvF = [];
    if (csvField('He said "go", I went') !== '"He said ""go"", I went"') csvF.push("comma + quotes");
    if (csvField("line1\nline2") !== '"line1\nline2"') csvF.push("newline");
    if (csvField(" padded") !== '" padded"' || csvField("plain") !== "plain") csvF.push("spaces / plain");
    if (csvField(null) !== "" || csvField(0) !== "0") csvF.push("null / 0");
    const csvLog = { version: 1, sessions: [
      { id: "b", startedAt: day(2), sets: [withSet({ note: 'tired, "heavy" legs', level: 3 })] },
      { id: "a", startedAt: day(1), sets: [base, withSet({ made: null, attempted: null, lostHandles: null, missedCalls: null, quality: null })] },
    ] };
    const lines = setsToCsv(csvLog).split("\r\n");
    if (lines[0] !== CSV_COLUMNS.join(",") || lines.length !== 5 || lines[4] !== "") csvF.push("rows " + lines.length);
    if (lines[1].indexOf("a," + day(1) + ",1,drive,,8,") !== 0) csvF.push("row 1: " + lines[1]);
    if (lines[2].indexOf("a," + day(1) + ",2,drive,,8,") !== 0 || !lines[2].endsWith("Z,,,,,,")) csvF.push("skipped row: " + lines[2]);
    if (!lines[3].endsWith(',5,8,1,0,clean,"tired, ""heavy"" legs"') || lines[3].indexOf(",drive,3,8,") === -1) csvF.push("note row: " + lines[3]);
    check("history: CSV has one row per set and escapes notes with commas and quotes", csvF);

    // 7. File name and unexported count.
    const misc = [];
    if (exportFileName(new Date(2026, 0, 5, 23, 59), "reaction-caller-log", "json") !== "reaction-caller-log-2026-01-05.json") misc.push("file name");
    if (unexportedCount(log, null) !== log.sessions.length) misc.push("never exported");
    if (unexportedCount(log, day(19)) !== 2) misc.push("after export " + unexportedCount(log, day(19)));
    check("history: export file name and count of sessions since the last export", misc);
  }

  return {
    LOG_VERSION,
    LOG_KEY,
    BACKUP_PREFIX,
    QUALITIES,
    NOTE_MAX,
    emptyLog,
    validateSet,
    snapshotSettings,
    upsertSession,
    setSuccess,
    setErrorRate,
    summarizeSession,
    summarizeSets,
    setsOfDrill,
    sessionDrills,
    summarizeByDrill,
    sessionLengthMs,
    compareWithPrevious,
    comparisonText,
    trendSeries,
    trendGeometry,
    deleteSession,
    parseImport,
    mergeLogs,
    csvField,
    setsToCsv,
    exportFileName,
    unexportedCount,
    parseLog,
    openLog,
    saveLog,
    selfTest,
  };
})();

  const logTitle = document.getElementById("logTitle");
  const logMade = document.getElementById("logMade");
  const logAttempted = document.getElementById("logAttempted");
  const logLost = document.getElementById("logLost");
  const logMissed = document.getElementById("logMissed");
  const qualityButtons = document.querySelectorAll("button[data-quality]");
  const logNoteDetails = document.getElementById("logNoteDetails");
  const logNote = document.getElementById("logNote");
  const logError = document.getElementById("logError");
  const saveRestBtn = document.getElementById("saveRestBtn");
  const saveEndBtn = document.getElementById("saveEndBtn");
  const skipLogBtn = document.getElementById("skipLogBtn");
  const discardBtn = document.getElementById("discardBtn");
  const restScreen = document.getElementById("restScreen");
  const restDrill = document.getElementById("restDrill");
  const restCount = document.getElementById("restCount");
  const restSummary = document.getElementById("restSummary");
  const restSaved = document.getElementById("restSaved");
  const nextSetBtn = document.getElementById("nextSetBtn");
  const endSessionBtn = document.getElementById("endSessionBtn");

  const STORAGE_MODE = "reactionCaller.mode";
  const STORAGE_DRILL = "reactionCaller.offenseDrill";
  const STORAGE_SETTINGS = "reactionCaller.settings";
  const STORAGE_LEARNED = "reactionCaller.learnedMs";

  // Where each validation error is shown (and which <details> to open for it).
  const ERROR_TARGETS = {
    drive: { el: driveError },
    advanced: { el: advancedError, details: advancedEl },
    speech: { el: speechError, details: speechEl },
    shooters: { el: shootersError },
    shootersAdvanced: { el: shootersAdvancedError, details: shootersAdvancedEl },
    session: { el: sessionError },
  };

  let voices = [];
  let selectedMode = "defense";
  let selectedDrill = "drive";
  let activeMode = null;

  function storageGet(key) {
    try {
      return window.localStorage.getItem(key);
    } catch (e) {
      return null;
    }
  }

  function storageSet(key, value) {
    try {
      window.localStorage.setItem(key, value);
    } catch (e) {}
  }

  // The store TrainingLog reads and writes through (reactionCaller.log and its backups).
  const logStore = { get: storageGet, set: storageSet };

  function loadVoices() {
    voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  }
  if (window.speechSynthesis) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function pickVoice() {
    return voices.find(v => v.lang && v.lang.startsWith("en")) || voices[0] || null;
  }

  // Defense cancels before every call (newest call always wins). Offense passes
  // cancel: false so calls queue instead of clipping; it only cancels on Stop.
  function speak(text, options) {
    const opts = options || {};
    if (!window.speechSynthesis) return null;
    if (opts.cancel !== false) window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const voice = pickVoice();
    if (voice) utter.voice = voice;
    utter.rate = opts.rate || 1;
    utter.pitch = 1;
    window.speechSynthesis.speak(utter);
    return utter;
  }

  function validateRange() {
    const offense = selectedMode === "offense";
    const min = parseInt(minMsInput.value, 10);
    const max = parseInt(maxMsInput.value, 10);
    if (isNaN(min) || isNaN(max) || min < 100 || max < 100) {
      rangeError.textContent = "Enter values of at least 100ms.";
      return null;
    }
    if (min > max) {
      rangeError.textContent = offense
        ? "Min read time must not exceed max read time."
        : "Min delay must not exceed max delay.";
      return null;
    }
    rangeError.textContent = "";
    return { min, max };
  }

  function randomDelay(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function showWord(text, className) {
    wordEl.textContent = text;
    wordEl.className = className || "";
    wordEl.classList.remove("show");
    void wordEl.offsetWidth;
    wordEl.classList.add("show");
  }

  function primeSpeech() {
    if (!window.speechSynthesis) return;
    const primer = new SpeechSynthesisUtterance(" ");
    primer.volume = 0;
    window.speechSynthesis.speak(primer);
  }

  // ---- Defense mode: random Left / Right / Up / Back ----

  const defenseMode = {
    timerId: null,

    start(settings) {
      this.scheduleNext(settings.min, settings.max);
    },

    scheduleNext(min, max) {
      this.timerId = setTimeout(() => {
        const word = WORDS[Math.floor(Math.random() * WORDS.length)];
        showWord(word, WORD_CLASS[word]);
        speak(word);
        this.scheduleNext(min, max);
      }, randomDelay(min, max));
    },

    stop() {
      if (this.timerId !== null) {
        clearTimeout(this.timerId);
        this.timerId = null;
      }
    },
  };

  // ---- Offense mode: READ -> LEFT/RIGHT -> CUT OFF / LAY UP ... -> finisher ----

  // Learned spoken lengths per phrase (ms at rate 1.0), kept in localStorage.
  function loadLearned() {
    let stored = null;
    try {
      stored = JSON.parse(storageGet(STORAGE_LEARNED));
    } catch (e) {}
    const learned = {};
    if (stored && typeof stored === "object") {
      Object.keys(OFFENSE_DEFAULTS.phrases).forEach(id => {
        if (typeof stored[id] === "number" && stored[id] > 0) learned[id] = stored[id];
      });
    }
    return learned;
  }

  let learnedMs = loadLearned();

  function recordSpokenLength(id, measuredMs, rate, settings) {
    const current = learnedMs[id] || settings.phrases[id].estMs;
    const next = P.learnDuration(current, measuredMs, rate, settings);
    if (next === null) return;
    learnedMs[id] = Math.round(next);
    storageSet(STORAGE_LEARNED, JSON.stringify(learnedMs));
  }

  function renderCountdown(remainingMs, totalMs) {
    countdownFill.style.transform = "scaleX(" + (totalMs > 0 ? remainingMs / totalMs : 0) + ")";
    countdownText.textContent = (remainingMs / 1000).toFixed(1) + " s";
  }

  // Runs rep plans from the active drill profile (see OffensePlanner.PROFILES),
  // grouped into sets of settings.training.repsPerSet reps.
  const offenseMode = {
    settings: null,
    profile: null,
    timers: [],
    rafId: null,
    runId: 0,
    progress: null,
    sessionStart: 0,
    clockId: null,
    warned: false,
    setStartedAt: null,  // ISO time the current set started
    repsCompleted: 0,    // reps of the current set whose endMs has passed

    start(settings) {
      this.settings = settings;
      this.profile = P.PROFILES[settings.drill];
      this.runId++;
      this.progress = P.newSession();
      countdownEl.classList.remove("hidden");
      this.startClock();
      this.beginSetClock();
      this.startRep();
    },

    beginSetClock() {
      this.setStartedAt = new Date().toISOString();
      this.repsCompleted = 0;
    },

    // Session clock (mm:ss) and the one-time fatigue warning. Runs for the
    // whole session, including the set log and rest screens, until it ends.
    startClock() {
      const t = this.settings.training;
      this.sessionStart = performance.now();
      this.warned = false;
      sessionBanner.classList.add("hidden");
      const tick = () => {
        const elapsed = performance.now() - this.sessionStart;
        sessionClock.textContent = P.formatElapsed(elapsed);
        if (!this.warned && P.sessionWarningDue(elapsed, t)) {
          this.warned = true;
          sessionBanner.textContent = P.sessionWarningText(t);
          sessionBanner.classList.remove("hidden");
        }
      };
      tick();
      this.clockId = setInterval(tick, 250);
    },

    // Called from the "Next set" tap (speech is primed there).
    nextSet() {
      this.progress = P.beginSet(this.progress);
      this.beginSetClock();
      wordEl.textContent = " ";
      wordEl.className = "";
      this.startRep();
    },

    // The set's last rep has reached its endMs: no more reps are scheduled.
    finishSet() {
      this.repsCompleted = this.progress.rep;
      this.stopCountdown();
      countdownEl.classList.add("idle");
      speak(this.settings.training.setDoneSpoken, { rate: this.settings.baseRate, cancel: false });
      openSetLog(false);
    },

    // Stop mid-set: clear every pending call and the countdown, but keep the
    // session (and its clock) going so the partial set can be logged.
    haltSet() {
      this.runId++;
      this.timers.forEach(clearTimeout);
      this.timers = [];
      this.stopCountdown();
      countdownEl.classList.add("idle");
    },

    // Every timer goes through here so Stop can clear all of them.
    later(fn, delayMs) {
      const id = setTimeout(() => {
        this.timers = this.timers.filter(t => t !== id);
        fn();
      }, Math.max(0, delayMs));
      this.timers.push(id);
    },

    say(id, rate) {
      const phrase = this.settings.phrases[id];
      const len = phrase.display.length;
      const long = len > 18 ? " long xlong" : len > 7 ? " long" : "";
      showWord(phrase.display, PHRASE_CLASS[id] + long);
      const utter = speak(phrase.spoken, { rate, cancel: false });
      if (utter) this.measure(utter, id, rate);
    },

    // Time onstart -> onend to learn this device's real spoken lengths. Missing
    // events, errors and anything cut short by Stop are simply ignored.
    measure(utter, id, rate) {
      const runId = this.runId;
      const settings = this.settings;
      let startedAt = null;
      utter.onstart = () => { startedAt = performance.now(); };
      utter.onerror = () => { startedAt = null; };
      utter.onend = () => {
        if (startedAt === null || runId !== this.runId) return;
        recordSpokenLength(id, performance.now() - startedAt, rate, settings);
      };
    },

    // Plan one rep and schedule all of it from a single clock origin.
    startRep() {
      const s = this.settings;
      this.progress = P.beginRep(this.progress);
      sessionProgress.textContent = P.progressLabel(this.progress, s.training);
      const plan = this.profile.planRep(s, s.durations, Math.random);

      // Rep clock: t = 0 is when the first call should be heard. Every call is
      // spoken speechLeadMs before its planned time to cover TTS start-up, so the
      // first call goes out right now. Each timer is computed from this origin,
      // never chained from the previous one, so drift does not accumulate.
      const origin = performance.now() + s.speechLeadMs;
      const at = ms => origin + ms - s.speechLeadMs - performance.now();

      countdownEl.classList.add("idle");
      plan.calls.forEach(call => {
        const delay = at(call.atMs);
        if (delay <= 0) this.say(call.id, call.rate);
        else this.later(() => this.say(call.id, call.rate), delay);
      });

      // The countdown bar is drawn only from plan.windows.
      plan.windows.forEach(w => {
        this.later(() => this.runCountdown(origin + w.startMs, w.durMs), at(w.startMs));
      });

      // The last rep of a set ends the set at its endMs, without waiting for its rest.
      if (P.isSetComplete(this.progress, s.training)) {
        this.later(() => this.finishSet(), origin + plan.endMs - performance.now());
      } else {
        this.later(() => { this.repsCompleted++; }, origin + plan.endMs - performance.now());
        this.later(() => this.startRep(), origin + plan.endMs + plan.restMs - performance.now());
      }
    },

    // Drain the bar from durMs to 0 starting at windowStart; it then sits empty at 0.0 s.
    runCountdown(windowStart, durMs) {
      this.stopCountdown();
      countdownEl.classList.remove("idle");
      const tick = () => {
        const remaining = Math.min(durMs, Math.max(0, windowStart + durMs - performance.now()));
        renderCountdown(remaining, durMs);
        this.rafId = remaining > 0 ? requestAnimationFrame(tick) : null;
      };
      tick();
    },

    stopCountdown() {
      if (this.rafId !== null) {
        cancelAnimationFrame(this.rafId);
        this.rafId = null;
      }
    },

    stop() {
      this.haltSet();
      if (this.clockId !== null) {
        clearInterval(this.clockId);
        this.clockId = null;
      }
      countdownEl.classList.add("hidden", "idle");
      sessionBanner.classList.add("hidden");
    },
  };

  // ---- Offense settings form ----

  // Settings are addressed by dotted paths into OFFENSE_DEFAULTS, e.g. "shooters.windowMinMs".
  function getPath(obj, path) {
    return path.split(".").reduce((o, key) => (o == null ? undefined : o[key]), obj);
  }

  function setPath(obj, path, value) {
    const keys = path.split(".");
    const last = keys.pop();
    keys.reduce((o, key) => o[key], obj)[last] = value;
  }

  function makeNumberField(inputId, labelText, attrs) {
    const field = document.createElement("div");
    field.className = "field";
    const label = document.createElement("label");
    label.htmlFor = inputId;
    label.textContent = labelText;
    const input = document.createElement("input");
    input.type = "number";
    input.id = inputId;
    input.min = attrs.min;
    input.step = attrs.step;
    Object.assign(input.dataset, attrs.data);
    field.append(label, input);
    return field;
  }

  function makeSection(titleText, fields) {
    const section = document.createElement("div");
    const title = document.createElement("p");
    title.className = "weight-title";
    title.textContent = titleText;
    const grid = document.createElement("div");
    grid.className = "field-grid";
    fields.forEach(f => grid.appendChild(f));
    section.append(title, grid);
    return section;
  }

  // Weight inputs for one drill. prefix is "" for Drive (so its input ids and
  // saved keys stay as before) and "shooters." for Shooters.
  function buildWeightTables(container, tables, prefix, titles) {
    tables.forEach(table => {
      const tablePath = prefix + table;
      const fields = Object.keys(getPath(OFFENSE_DEFAULTS, tablePath)).map(id => {
        const inputId = "w-" + tablePath.replace(/\./g, "-") + "-" + id;
        const labelText = prefix && SHORT_LABELS[id] ? SHORT_LABELS[id] : OFFENSE_DEFAULTS.phrases[id].display;
        return makeNumberField(inputId, labelText, {
          min: "0", step: "1", data: { weightTable: tablePath, weightId: id },
        });
      });
      container.appendChild(makeSection(titles[table], fields));
    });
  }

  // Get-set min/max inputs, one pair per start call.
  function buildGetSetFields() {
    const fields = [];
    P.START_CALLS.forEach(id => {
      ["min", "max"].forEach(end => {
        fields.push(makeNumberField("sh-getSet-" + id + "-" + end, SHORT_LABELS[id] + " " + end + " (ms)", {
          min: "0", step: "100", data: { setting: "shooters.getSetMs." + id + "." + end + "Ms" },
        }));
      });
    });
    getSetFieldsEl.appendChild(makeSection("Get-set time after the start call", fields));
  }

  function parseNumber(value) {
    return String(value).trim() === "" ? NaN : Number(value);
  }

  function settingInputs() {
    return offensePanel.querySelectorAll("input[data-setting]");
  }

  function weightInputs() {
    return offensePanel.querySelectorAll("input[data-weight-table]");
  }

  // Session inputs: data-training keys into TRAINING_DEFAULTS.
  function trainingInputs() {
    return offensePanel.querySelectorAll("input[data-training]");
  }

  function fillOffenseDefaults() {
    settingInputs().forEach(input => { input.value = getPath(OFFENSE_DEFAULTS, input.dataset.setting); });
    weightInputs().forEach(input => {
      input.value = getPath(OFFENSE_DEFAULTS, input.dataset.weightTable)[input.dataset.weightId];
    });
    trainingInputs().forEach(input => { input.value = P.TRAINING_DEFAULTS[input.dataset.training]; });
  }

  function readTrainingSettings() {
    const t = Object.assign({}, P.TRAINING_DEFAULTS);
    trainingInputs().forEach(input => { t[input.dataset.training] = parseNumber(input.value); });
    return t;
  }

  // − / + buttons inside root: step the input by its step, clamped to its
  // min/max, then fire "input" so the change is handled like typing. An empty
  // field steps from its default (Session fields) or from 0.
  function wireSteppers(root) {
    root.querySelectorAll(".stepper").forEach(stepper => {
      const input = stepper.querySelector("input");
      stepper.querySelectorAll("button[data-step]").forEach(btn => btn.addEventListener("click", () => {
        const step = Number(input.step) || 1;
        const min = input.min === "" ? -Infinity : Number(input.min);
        const max = input.max === "" ? Infinity : Number(input.max);
        const current = parseNumber(input.value);
        const base = !isNaN(current) ? current
          : input.dataset.training ? P.TRAINING_DEFAULTS[input.dataset.training] : 0;
        input.value = Math.min(max, Math.max(min, base + Number(btn.dataset.step) * step));
        input.dispatchEvent(new Event("input"));
      }));
    });
  }

  // range is the shared Min/Max read time (Drive only; null for Shooters).
  function readOffenseSettings(range) {
    const s = P.cloneSettings(OFFENSE_DEFAULTS);
    settingInputs().forEach(input => { setPath(s, input.dataset.setting, parseNumber(input.value)); });
    weightInputs().forEach(input => {
      getPath(s, input.dataset.weightTable)[input.dataset.weightId] = parseNumber(input.value);
    });
    if (range) {
      s.readMinMs = range.min;
      s.readMaxMs = range.max;
    }
    s.drill = selectedDrill;
    s.training = readTrainingSettings();
    return s;
  }

  // ---- Persistence: mode, drill, shared Min/Max fields and offense settings only ----
  // Values are saved by input id, so settings saved before a field existed
  // simply keep that field's default.

  function persistedInputs() {
    return [minMsInput, maxMsInput].concat(
      Array.from(settingInputs()), Array.from(weightInputs()), Array.from(trainingInputs()));
  }

  function saveSettings() {
    const values = {};
    persistedInputs().forEach(input => { values[input.id] = input.value; });
    storageSet(STORAGE_SETTINGS, JSON.stringify(values));
  }

  function loadSettings() {
    let values = null;
    try {
      values = JSON.parse(storageGet(STORAGE_SETTINGS));
    } catch (e) {}
    if (!values || typeof values !== "object") return;
    persistedInputs().forEach(input => {
      if (typeof values[input.id] === "string") input.value = values[input.id];
    });
  }

  // ---- Modes ----

  const MODES = {
    defense: {
      mode: defenseMode,
      label: "DEFENSE",
      subtitle: "A voice randomly calls Left, Right, Up, or Back. React fast.",
      minLabel: "Min delay (ms)",
      maxLabel: "Max delay (ms)",
    },
    offense: {
      mode: offenseMode,
      // Label and subtitle come from DRILLS.
      minLabel: "Min read time (ms)",
      maxLabel: "Max read time (ms)",
    },
  };

  function has(obj, key) {
    return typeof key === "string" && Object.prototype.hasOwnProperty.call(obj, key);
  }

  function clearErrors() {
    rangeError.textContent = "";
    Object.keys(ERROR_TARGETS).forEach(key => { ERROR_TARGETS[key].el.textContent = ""; });
  }

  function showError(error) {
    const target = ERROR_TARGETS[error.field];
    if (target.details) target.details.open = true;
    target.el.textContent = error.message;
  }

  // Show the panels, labels and subtitle for the selected mode and drill.
  function updateView() {
    const offense = selectedMode === "offense";
    const shooters = selectedDrill === "shooters";
    const info = MODES[selectedMode];
    modeButtons.forEach(btn => btn.setAttribute("aria-pressed", String(btn.dataset.mode === selectedMode)));
    drillButtons.forEach(btn => btn.setAttribute("aria-pressed", String(btn.dataset.drill === selectedDrill)));
    subtitleEl.textContent = offense ? DRILLS[selectedDrill].subtitle : info.subtitle;
    minMsLabel.textContent = info.minLabel;
    maxMsLabel.textContent = info.maxLabel;
    offensePanel.classList.toggle("hidden", !offense);
    // The read time only applies to Drive.
    rangePanel.classList.toggle("hidden", offense && shooters);
    driveSettings.classList.toggle("hidden", shooters);
    shootersSettings.classList.toggle("hidden", !shooters);
    clearErrors();
  }

  function selectMode(name) {
    selectedMode = has(MODES, name) ? name : "defense";
    updateView();
  }

  function selectDrill(name) {
    selectedDrill = has(DRILLS, name) ? name : "drive";
    updateView();
  }

  function startGame() {
    clearErrors();
    const usesRange = selectedMode === "defense" || selectedDrill === "drive";
    const range = usesRange ? validateRange() : null;
    if (usesRange && !range) return;

    let settings = range;
    if (selectedMode === "offense") {
      settings = readOffenseSettings(range);
      // Spoken lengths are fixed for the whole run (the ones validated here);
      // anything learned during the run takes effect on the next Start.
      settings.durations = P.durationsFor(settings, learnedMs);
      const error = P.PROFILES[settings.drill].validate(settings, settings.durations) ||
        P.validateSession(settings.training);
      if (error) {
        showError(error);
        return;
      }
    }

    primeSpeech();

    const offense = selectedMode === "offense";
    startScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
    modeLabel.textContent = offense ? DRILLS[selectedDrill].label : MODES[selectedMode].label;
    logDrill.textContent = modeLabel.textContent;
    restDrill.textContent = modeLabel.textContent;
    sessionClock.classList.toggle("hidden", !offense);
    sessionProgress.classList.toggle("hidden", !offense);
    sessionBanner.classList.add("hidden");
    wordEl.textContent = " ";
    wordEl.className = "";

    if (offense) {
      session = {
        id: "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        startedAt: new Date().toISOString(),
        endedAt: null,
        sets: [],
      };
    }

    activeMode = MODES[selectedMode].mode;
    activeMode.start(settings);
  }

  // Ends the session (Defense Stop, End session, Discard). Offense sessions
  // with saved sets get their end time written to the log.
  function stopGame() {
    if (activeMode) {
      activeMode.stop();
      activeMode = null;
    }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    stopRest();
    if (session && session.sets.length > 0) {
      session.endedAt = new Date().toISOString();
      persistSession();
    }
    session = null;
    pendingSet = null;

    gameScreen.classList.add("hidden");
    logScreen.classList.add("hidden");
    restScreen.classList.add("hidden");
    startScreen.classList.remove("hidden");
  }

  // Stop button. Mid-set in Offense with at least one finished rep, the set is
  // halted and its log form shown for the partial set; otherwise the session ends.
  function stopPressed() {
    if (activeMode === offenseMode && offenseMode.repsCompleted > 0) {
      offenseMode.haltSet();
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      openSetLog(true);
      return;
    }
    stopGame();
  }

  // ---- Set log ----

  let trainingLog = TrainingLog.openLog(logStore);
  let session = null;     // current Offense session { id, startedAt, endedAt, sets }
  let pendingSet = null;  // the set shown in the log form (without its outcome fields)
  let selectedQuality = null;
  let lastSaveOk = true;
  let restTimerId = null;

  function selectQuality(quality) {
    selectedQuality = quality;
    qualityButtons.forEach(btn => btn.setAttribute("aria-pressed", String(btn.dataset.quality === quality)));
  }

  // Show the log form for the set that just ended (partial: after Stop mid-set).
  function openSetLog(partial) {
    const s = offenseMode.settings;
    const p = offenseMode.progress;
    const reps = offenseMode.repsCompleted;
    pendingSet = {
      drill: s.drill,
      level: null,
      reps,
      startedAt: offenseMode.setStartedAt,
      endedAt: new Date().toISOString(),
      settingsSnapshot: TrainingLog.snapshotSettings(s),
      extra: {},
    };
    logTitle.textContent = partial
      ? "Partial set " + p.set + " · " + reps + " of " + s.training.repsPerSet + " reps"
      : "Set " + p.set + " · " + reps + (reps === 1 ? " rep" : " reps");
    logAttempted.value = reps;
    logMade.max = String(reps);
    logMade.value = 0;
    logLost.value = 0;
    logMissed.value = 0;
    selectQuality(null);
    logNote.value = "";
    logNoteDetails.open = false;
    logError.textContent = "";
    discardBtn.classList.toggle("hidden", !partial);
    gameScreen.classList.add("hidden");
    logScreen.classList.remove("hidden");
    window.scrollTo(0, 0);
  }

  function readLoggedSet() {
    const note = logNote.value.trim();
    return Object.assign({}, pendingSet, {
      made: parseNumber(logMade.value),
      attempted: parseNumber(logAttempted.value),
      lostHandles: parseNumber(logLost.value),
      missedCalls: parseNumber(logMissed.value),
      quality: selectedQuality,
      note: note === "" ? null : note,
    });
  }

  function skippedSet() {
    return Object.assign({}, pendingSet, {
      made: null, attempted: null, lostHandles: null, missedCalls: null, quality: null, note: null,
    });
  }

  function persistSession() {
    trainingLog = Object.assign({}, trainingLog, { log: TrainingLog.upsertSession(trainingLog.log, session) });
    const result = TrainingLog.saveLog(trainingLog, logStore, Date.now());
    trainingLog = result.state;
    lastSaveOk = result.saved;
  }

  // Validate, add the set to the session and save the whole log right away, so
  // nothing is lost if the tab closes. Returns false (and shows why) if invalid.
  function commitSet(set) {
    const error = TrainingLog.validateSet(set);
    if (error) {
      logError.textContent = error.message;
      return false;
    }
    session.sets.push(set);
    session.endedAt = set.endedAt;
    persistSession();
    pendingSet = null;
    return true;
  }

  function percent(x) {
    return Math.round(x * 100) + "%";
  }

  function sessionSummaryText() {
    const sum = TrainingLog.summarizeSession(session);
    const parts = [sum.sets + (sum.sets === 1 ? " set" : " sets")];
    if (sum.makePct !== null) parts.push(sum.made + "/" + sum.attempted + " made (" + percent(sum.makePct) + ")");
    if (sum.errorsPerRep !== null) parts.push(sum.errorsPerRep.toFixed(2) + " errors per rep");
    if (sum.cleanShare !== null) parts.push(sum.cleanSets + " of " + sum.ratedSets + " rated sets clean");
    return "This session: " + parts.join(" · ");
  }

  // Rest countdown, then the Next set button.
  function showRest() {
    const restMs = offenseMode.settings.training.restSec * 1000;
    const endsAt = performance.now() + restMs;
    restSummary.textContent = sessionSummaryText();
    restSaved.textContent = lastSaveOk ? "Set saved." : "Couldn't save to this device. Storage may be blocked or full.";
    nextSetBtn.classList.add("hidden");
    logScreen.classList.add("hidden");
    restScreen.classList.remove("hidden");
    const tick = () => {
      const left = Math.max(0, endsAt - performance.now());
      restCount.textContent = P.formatElapsed(Math.ceil(left / 1000) * 1000);
      if (left <= 0) {
        stopRest();
        nextSetBtn.classList.remove("hidden");
      }
    };
    tick();
    if (restMs > 0) restTimerId = setInterval(tick, 250);
  }

  function stopRest() {
    if (restTimerId !== null) {
      clearInterval(restTimerId);
      restTimerId = null;
    }
  }

  function saveAndRest() {
    if (commitSet(readLoggedSet())) showRest();
  }

  function saveAndEnd() {
    if (commitSet(readLoggedSet())) stopGame();
  }

  function skipLogging() {
    if (commitSet(skippedSet())) showRest();
  }

  // A fresh tap, so speech is primed again before the set's first call.
  function startNextSet() {
    if (activeMode !== offenseMode) return;
    primeSpeech();
    stopRest();
    restScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
    offenseMode.nextSet();
  }

  buildWeightTables(weightTablesEl, P.WEIGHT_TABLES, "", WEIGHT_TABLE_TITLES);
  buildGetSetFields();
  buildWeightTables(shootersWeightTablesEl, P.SHOOTERS_WEIGHT_TABLES, "shooters.", SHOOTERS_WEIGHT_TABLE_TITLES);
  fillOffenseDefaults();
  loadSettings();
  persistedInputs().forEach(input => input.addEventListener("input", saveSettings));
  wireSteppers(offensePanel);
  wireSteppers(logScreen);
  // Made can never exceed attempted: lowering attempted pulls made down with it.
  logAttempted.addEventListener("input", () => {
    const attempted = parseNumber(logAttempted.value);
    if (Number.isInteger(attempted) && attempted >= 0) {
      logMade.max = String(attempted);
      if (parseNumber(logMade.value) > attempted) logMade.value = attempted;
    }
  });
  qualityButtons.forEach(btn => btn.addEventListener("click", () => {
    selectQuality(selectedQuality === btn.dataset.quality ? null : btn.dataset.quality);
  }));

  modeButtons.forEach(btn => btn.addEventListener("click", () => {
    selectMode(btn.dataset.mode);
    storageSet(STORAGE_MODE, selectedMode);
  }));
  drillButtons.forEach(btn => btn.addEventListener("click", () => {
    selectDrill(btn.dataset.drill);
    storageSet(STORAGE_DRILL, selectedDrill);
  }));
  const savedDrill = storageGet(STORAGE_DRILL);
  selectedDrill = has(DRILLS, savedDrill) ? savedDrill : "drive";
  selectMode(storageGet(STORAGE_MODE));

  startBtn.addEventListener("click", startGame);
  stopBtn.addEventListener("click", stopPressed);
  saveRestBtn.addEventListener("click", saveAndRest);
  saveEndBtn.addEventListener("click", saveAndEnd);
  skipLogBtn.addEventListener("click", skipLogging);
  discardBtn.addEventListener("click", stopGame);
  nextSetBtn.addEventListener("click", startNextSet);
  endSessionBtn.addEventListener("click", stopGame);
})();
</script>
<script>
// ?selftest=1: run the offense planner simulation and show the results.
(function () {
  if (new URLSearchParams(window.location.search).get("selftest") !== "1") return;

  document.getElementById("app").classList.add("hidden");
  const banner = document.createElement("pre");
  banner.style.cssText = "margin:0;padding:16px;white-space:pre-wrap;font-size:13px;line-height:1.5;";
  document.body.appendChild(banner);

  const lines = [];
  const log = line => {
    console.log(line);
    lines.push(line);
  };

  log("Reaction Caller offense self-test (Drive, Shooters, Session and Training log)\n");
  const result = OffensePlanner.runSelfTest(log, 10000, [TrainingLog.selfTest]);
  console.table(result.fitTables.drive);
  console.table(result.fitTables.shooters);

  const s = OffensePlanner.OFFENSE_DEFAULTS;
  lines.push("\nDrive fit table: minimum drive window at maxRate " + s.maxRate + ", minGap " + s.minGapMs +
    " ms, buffer " + s.finisherBufferMs + " ms (driveMaxMs " + s.driveMaxMs + ")");
  result.fitTables.drive.forEach(r => {
    lines.push(r.cutOffs + " cut-offs  " + (r.finisher + "                  ").slice(0, 19) +
      String(r.minWindowMs).padStart(5) + " ms  fits: " + r.fitsAtDriveMax);
  });

  const sh = s.shooters;
  lines.push("\nShooters fit table: minimum window at maxRate " + s.maxRate + ", minGap " + s.minGapMs +
    " ms, shot buffer " + sh.shotBufferMs + " ms (windowMaxMs " + sh.windowMaxMs + ")");
  result.fitTables.shooters.forEach(r => {
    lines.push(r.cutOffs + " cut-offs  " + r.sequence.padEnd(33) +
      String(r.minWindowMs).padStart(5) + " ms  fits: " + r.fitsAtWindowMax);
  });

  banner.style.color = result.passed ? "#4fd87c" : "#ff4f5e";
  banner.textContent = lines.join("\n");
})();
</script>
